packages:
  - 'apps/*'

# Avoid a known transitive query-string decoder denial-of-service issue.
overrides:
  decode-uri-component: 0.5.0

# query-string v7 expects a CommonJS function; 0.5.0 exports a default object.
# Patch only the consumer interop, retaining the newer decoder override.
patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
