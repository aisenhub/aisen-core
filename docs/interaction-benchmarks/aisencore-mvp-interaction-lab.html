/* AisenCore Interaction Lab · Visual refinement 02
   Editorial clarity, polished feedback, and a deliberately self-contained offline surface. */
:root{
  --bg:#f4f5f2;--surface:#ffffff;--ink:#1c2740;--muted:#6f7c90;
  --line:#e5e9ee;--accent:#5951eb;--pale:#eeedff;--navy:#101d34;
  --lime:#dffa84;--mint:#dff8e9;--r:20px;
  --shadow:0 10px 35px rgba(27,39,65,.038);
  --font:"Segoe UI Variable","Inter","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
}
html{scroll-padding-top:96px}
body{
  background:
    radial-gradient(circle at 83% -7%,rgba(204,202,255,.25),transparent 33rem),
    radial-gradient(circle at 29% 77%,rgba(226,236,226,.42),transparent 38rem),
    var(--bg);
  color:var(--ink);font-size:14px;line-height:1.64;
  font-feature-settings:"ss01" on,"cv11" on;
}
:focus-visible{outline:3px solid #7c77f3;outline-offset:3px}
button,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.layout{grid-template-columns:264px minmax(0,1fr)}
.sidebar{
  background:#111c32;color:#edf4ff;border-right:1px solid #21314c;
  padding:27px 17px 18px;box-shadow:9px 0 34px rgba(12,21,41,.055);
}
.brand{margin:0 9px 25px;padding:0 0 24px;border-bottom:1px solid rgba(239,247,255,.12);gap:12px}
.logo{
  height:44px;width:44px;border-radius:13px;
  color:#141f32;background:var(--lime);
  transform:rotate(-6deg);box-shadow:0 8px 22px rgba(207,245,113,.12);
}
.logo svg{transform:rotate(6deg)}
.brandword{font-size:23px;color:#f7f9ff;letter-spacing:-1.45px;font-weight:820}
.brandword span{color:#d2f47f;font-weight:500}
.brandword small{font-size:9px;color:#8fa1b9;letter-spacing:1.9px;margin-top:9px}
.navtitle{
  margin:23px 13px 10px;font-size:10px;color:#7f8da9;
  letter-spacing:1.65px;font-weight:760;
}
.navlink{
  min-height:42px;border-radius:10px;margin:2px 0;padding:10px 12px;
  color:#acb9ce;font-size:12px;font-weight:650;gap:12px;
  transition:background .18s,color .18s,transform .18s,box-shadow .18s;
}
.navlink svg{height:18px;width:18px;opacity:.85}
.navlink:hover{background:rgba(255,255,255,.075);color:#fff;transform:translateX(2px)}
.navlink.active{
  background:#dffa84;color:#142035;
  box-shadow:0 5px 19px rgba(200,238,116,.11);font-weight:800;
}
.navlink.active:hover{color:#142035;background:#e6ff9c;transform:none}
.navlink.active svg{opacity:1}
.navnum{
  opacity:1;font-size:10px;padding:1px 7px;
  border-radius:6px;background:rgba(255,255,255,.1);color:#cbd4e7
}
.navlink.active .navnum{color:#334129;background:rgba(22,40,34,.09)}
.sidebar-foot{
  position:relative;margin-top:auto;padding:19px 13px 3px;
  border-top:1px solid rgba(239,247,255,.12);color:#8493ae;line-height:1.8;
}
.sidebar-foot strong{color:#d7f5a6;font-weight:760;letter-spacing:1.2px}
.sidebar-foot p{font-size:11px;line-height:1.75}
.online{background:#c4f77b;box-shadow:0 0 0 4px rgba(194,247,123,.12)}
.top{
  height:78px;background:rgba(251,252,250,.85);
  border-bottom:1px solid #e3e8e9;
  box-shadow:0 7px 28px rgba(41,55,78,.027);
  padding:0 clamp(24px,3.5vw,58px);
}
.crumb{font-size:12px;font-weight:750;gap:11px}
.crumb .dim{color:#9ba5b3;font-weight:550}
.topright{gap:10px}
.top-command{
  display:inline-flex;align-items:center;gap:15px;min-height:36px;
  border:1px solid #e2e6ee;background:#fff;color:#788498;
  border-radius:10px;padding:0 9px 0 13px;font-size:11px;font-weight:620;
  box-shadow:0 2px 5px rgba(13,28,51,.02);
  transition:border .2s,transform .2s,box-shadow .2s;
}
.top-command:hover{border-color:#bab8ee;color:#3b4178;transform:translateY(-1px)}
.top-command kbd,.shortcut{
  border:1px solid #dde3eb;box-shadow:0 1px 0 #e4e7ee;
  background:#f7f8fc;color:#647187;border-radius:5px;
  padding:3px 6px;font:10px/1.25 Consolas,monospace;
}
.select-mini,.iconbtn{border:1px solid #e2e7ed;box-shadow:0 2px 5px rgba(13,28,51,.025)}
.select-mini{max-width:180px;min-height:37px;font-size:12px}
.iconbtn{width:38px;height:38px}
.iconbtn:hover{background:#eae8ff;color:var(--accent)}

function modelProbe(key){
const d=seed(),time=now(),valid=g=>!g.revoked&&g.start<=time&&(g.end===null||g.end>time);
switch(key){
case"metrics":return d.products.length===3&&d.users.length===6&&d.codes.length===2;
case"auth":{const original=DB,level=S.session;let result=false;try{DB=d;S.session="aal1";const denied=!adminOK();S.session="aal2";result=denied&&adminOK()}finally{DB=original;S.session=level}return result}
case"admin":{const original=DB,level=S.session;let result=false;try{DB=d;S.session="aal2";const before=adminOK();d.admins.find(x=>x.user==="owner").active=false;result=before&&!adminOK()}finally{DB=original;S.session=level}return result}
case"product":{const m=d.members.length,g=d.grants.length;d.products[0].status="paused";return m===d.members.length&&g===d.grants.length}
case"identity":return d.users.every(x=>!!x.id&&!!x.email)&&!Object.keys(d.users[0]).some(x=>/password|token/i.test(x))&&users().includes("模拟查询不完整");
case"member":{const m=d.members.find(x=>x.id==="MB-002");m.before=m.status;m.status="suspended";m.status=m.before;return m.status==="left"}
case"duration":{const c=d.codes[0],n=c.duration;const visualPreset=365;return c.duration===n&&visualPreset!==n}
case"boundary":return d.products.every(p=>!Object.keys(p).some(k=>/free_features|free_limits|plan_id/i.test(k)))&&d.grants.every(g=>g.tier!=="free");
case"grant":{const end=d.grants.filter(g=>g.user==="mia"&&g.product==="lens"&&g.end).reduce((m,g)=>Math.max(m,g.end),time);return end+30*DAY>end}
case"issue":return d.codes.every(c=>c.used<=c.max)&&new Set(d.batches.map(b=>b.request)).size===d.batches.length;
case"secret":return d.codes.every(c=>!Object.keys(c).some(k=>/plain|secret|hash|raw/i.test(k)));
case"unknown":return d.batches.every(b=>!!b.request&&!Object.keys(b).includes("plaintext"));
case"projection":return d.audit.every(e=>!JSON.stringify(e).includes("LENS-DEMO-2026"));
case"last":{const original=DB;DB=d;try{return isLastAdmin("owner")&&!isLastAdmin("alex")}finally{DB=original}}
case"fault":return ["401","403","409","429","503","timeout"].every(c=>security().includes('value="'+c+'"'));
case"order":return d.members.find(m=>m.id==="MB-002").status==="left"&&d.codes[0].used===0;
case"mask":return d.codes.every(c=>["lens","note"].includes(c.product));
case"duplicate":return d.redemptions.filter(r=>r.user==="june"&&r.code==="CD-002").length===1;
case"tier":{d.grants.find(g=>g.id==="GR-001").revoked=true;return !d.grants.some(g=>g.user==="mia"&&g.product==="lens"&&valid(g))}
case"feedbackprivacy":{const prior=DB,actor=S.actor;try{DB=d;S.actor="june";const html=feedbackPublic(),confidential=d.feedback.find(f=>f.id==="FB-1041").notes[0].text;return publicFeedbackRows("june",d.feedback).length===d.feedback.filter(f=>f.user==="june").length&&!html.includes(confidential)&&!html.includes("FB-1042")&&html.includes("FB-1041")}finally{DB=prior;S.actor=actor}}
case"feedbackflow":return FEEDBACK_NEXT.new.includes("triaged")&&!FEEDBACK_NEXT.new.includes("closed")&&FEEDBACK_NEXT.in_progress.includes("resolved")&&FEEDBACK_NEXT.resolved.includes("closed")&&FEEDBACK_NEXT.closed.includes("in_progress");
case"feedbackguard":{const prior=DB,level=S.session,where=S.page,scope=S.scope;try{DB=d;S.scope="lens";S.page="feedback";S.session="aal1";const denied=page().includes("管理权限受限")&&!page().includes("导出完成后进度提示");S.session="aal2";return denied&&page().includes("反馈收件箱")}finally{DB=prior;S.session=level;S.page=where;S.scope=scope}}
case"spacenav":{const g=GLOBAL_NAV.flatMap(x=>x[1].map(y=>y[0])),p=PRODUCT_NAV.flatMap(x=>x[1].map(y=>y[0]));return g.includes("products")&&g.includes("security")&&!g.includes("codes")&&!g.includes("feedback")&&p.includes("codes")&&p.includes("feedback")&&p.includes("users")&&!p.includes("members")&&!p.includes("products")&&!p.includes("security")}
case"spacefeedback":{const original=DB,scope=S.scope;try{DB=d;S.scope="lens";const html=feedback();return html.includes("导出完成后进度提示")&&!html.includes("建议知识卡片支持更灵活的整理方式")&&DB.feedback.filter(f=>f.product==="lens").length===3}finally{DB=original;S.scope=scope}}
case"membermerge":{const oldDb=DB,oldScope=S.scope,oldStatus=S.memberStatus,oldSelected=S.selectedUser;try{DB=d;S.scope="lens";S.selectedUser=null;S.memberStatus="suspended";const suspended=users();S.memberStatus="active";const active=users();S.scope="all";const global=users();return suspended.includes("June Wu")&&!suspended.includes("林沐")&&suspended.includes('data-action="restore"')&&active.includes("林沐")&&!active.includes("June Wu")&&active.includes('data-action="suspend"')&&!global.includes('data-action="suspend"')}finally{DB=oldDb;S.scope=oldScope;S.memberStatus=oldStatus;S.selectedUser=oldSelected}}
case"spaceforms":{const scope=S.scope,request=S.issueReq,draft=S.issueDraft,edit=S.issueEdit,grantReq=S.grantReq;try{S.scope="lens";S.issueDraft=null;S.issueEdit=null;const issue=issueFields(),grant=grants();return issue.includes('name="product" value="lens"')&&grant.includes('name="product" value="lens"')&&!issue.includes('select name="product"')&&!grant.includes('select name="product"')}finally{S.scope=scope;S.issueReq=request;S.issueDraft=draft;S.issueEdit=edit;S.grantReq=grantReq}}
case"backup":return d.products.every(p=>!Object.keys(p).some(k=>/r2_quota|storage|feature/i.test(k)));
case"cross":return d.grants.some(g=>g.user==="alex"&&g.product==="lens"&&valid(g))&&!d.grants.some(g=>g.user==="alex"&&g.product==="note"&&valid(g));
default:return false;
}}

function safeWrite(op){
if(!requireAdmin())return false;
if(["grant","issue","code","member","feedback"].includes(op)&&!isProduct()){toast("SCOPE_REQUIRED","产品业务写入只允许在当前产品管理空间。",true);return false}

function duplicateRequest(map,key,signature,mode){
if(!map[key])return false;
if(map[key].signature!==signature){toast("409 / IDEMPOTENCY_CONFLICT","同一 Request ID 的参数与第一次不同。",true);return "conflict"}
toast("幂等重放：未重复写入","已发现相同 Request ID，只返回原记录摘要，绝不重取码明文。");
return "same";
}
function handleGrant(form){
if(!requireAdmin())return;
const f=new FormData(form),userId=String(f.get("user")),pid=String(f.get("product"));if(!guardProduct(pid,"直授 Pro"))return;
const mode=String(f.get("mode")),req=String(f.get("request")||"").trim(),reason=String(f.get("reason")||"").trim();
const days=mode==="duration"?Number(f.get("duration")):null, startValue=mode==="window"?String(f.get("start")):null,endValue=mode==="window"?String(f.get("end")):null;
if(!req||!reason||!U(userId)||!P(pid)||!["duration","window","permanent"].includes(mode)){toast("参数不正确","请核对用户、产品、授权方式与 Request ID。",true);return}
if(mode==="duration"&&(!Number.isInteger(days)||days<1||days>3650)){toast("时长非法","必须为合法正整数天数。",true);return}
let start,end;
if(mode==="duration"){const dated=DB.grants.filter(g=>g.user===userId&&g.product===pid&&!g.revoked&&g.end===null&&g.start<=now());if(dated.length){toast("状态冲突","当前已有永久 Pro，不能对其自动顺延周期。",true);return}start=DB.grants.filter(g=>g.user===userId&&g.product===pid&&!g.revoked&&g.end!==null).reduce((t,g)=>Math.max(t,g.end),now());end=start+days*DAY}
if(mode==="window"){start=new Date(startValue).getTime();end=new Date(endValue).getTime();if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start){toast("时间区间不合法","结束时间须晚于开始时间。",true);return}}
if(mode==="permanent"){if(f.get("confirmLifetime")!=="yes"){toast("永久授权需要二次确认","请勾选永久 Pro 授权确认项。",true);return}start=now();end=null}
const signature=JSON.stringify({userId,pid,mode,days,startValue,endValue});
if(duplicateRequest(DB.grantReq,req,signature,"grant"))return;
if(!safeWrite("grant")){refresh();return}
const g={id:nid("GR"),user:userId,product:pid,start,end,revoked:false,source:"direct"};
DB.grants.unshift(g);DB.grantReq[req]={signature,grant:g.id};S.dirty=false;auditPush("grant.create",g.id,reason);
toast("已创建 Pro Grant",pn(pid)+" · "+un(userId)+" · "+(end===null?"永久":date(start)+" → "+date(end)));
refresh();
}
function handleIssue(form){
if(!requireAdmin())return;
const f=form instanceof FormData?form:new FormData(form),pid=String(f.get("product")),durationText=String(f.get("duration")),duration=durationText==="permanent"?null:Number(durationText),qty=Number(f.get("qty")),max=Number(f.get("max")),req=String(f.get("request")||"").trim(),expiryText=String(f.get("expiry")||"");
if(!guardProduct(pid,"发行兑换码"))return;
 const expiry=expiryText?new Date(expiryText+"T23:59:59").getTime():null;
if(!P(pid)||P(pid).status!=="active"){toast("PRODUCT_UNAVAILABLE","请选择当前启用的产品。",true);return}
if(!Number.isInteger(qty)||qty<1||qty>24||!Number.isInteger(max)||max<1||max>20||(!Number.isInteger(duration)&&duration!==null)||duration!==null&&duration<1||!req||expiry!==null&&(!Number.isFinite(expiry)||expiry<=now())){toast("发行参数非法","请检查数量、次数、时长、过期时间与 Request ID。",true);return}
if(S.unknown){toast("UNKNOWN / PENDING","请完成原请求恢复，禁止在不确定状态下新发行。",true);return}
const signature=JSON.stringify({pid,duration,qty,max,expiryText});
if(duplicateRequest(DB.issueReq,req,signature,"issue")){S.reveal=null;refresh();return}
const injection=simulatedFault("issue");if(injection==="blocked"){refresh();return}
if(injection==="timeout_empty"){S.reveal=null;S.unknown={request:req,batch:null,checked:false,mode:"not_created",params:Object.fromEntries(f)};toast("UNKNOWN / 未收到响应","模拟服务器未落库；仍须按原 Request ID 确认后才可重放。",true);refresh();return}
const batch={id:nid("BAT"),product:pid,duration,qty,request:req,time:now(),revoked:false};
DB.batches.unshift(batch);const plaintext=[];
for(let i=0;i<qty;i++){const codeId=nid("CD"),plain="TEST-"+Math.random().toString(36).slice(2,11).toUpperCase()+"-"+Math.random().toString(36).slice(2,11).toUpperCase();DB.codes.unshift({id:codeId,batch:batch.id,product:pid,duration,max,used:0,expiry,revoked:false});SECRET.set(plain,codeId);plaintext.push(plain)}
DB.issueReq[req]={signature,batch:batch.id};S.dirty=false;auditPush("codes.issue",batch.id,"发行 "+qty+" 张模拟码 · "+pn(pid));
if(injection==="timeout"){S.reveal=null;S.unknown={request:req,batch:batch.id,checked:false,mode:"created",params:Object.fromEntries(f)};toast("UNKNOWN / 响应丢失","模拟可信端已创建批次，但明文不可恢复。",true)}
else{S.reveal={batch:batch.id,codes:plaintext};S.unknown=null;toast("发行成功","仅本次响应展示 "+qty+" 张合成明文码。")}
refresh();
}
function failRedeem(userId,code,details){

function handleRedeem(form){
const f=new FormData(form),uid=String(f.get("user")),pid=String(f.get("product")),entered=String(f.get("code")||"").trim().toUpperCase(),u=U(uid),p=P(pid),m=M(uid,pid);
S.actor=uid;const a=(DB.attempts[uid]||[]).filter(t=>t>now()-15*60000);DB.attempts[uid]=a;
if(!u||!u.verified){failRedeem(uid,"401 / SESSION_REQUIRED");refresh();return}
if(u.blocked){failRedeem(uid,"ACCOUNT_BLOCKED");refresh();return}
if(a.length>=10){S.lastResult="RATE_LIMITED";toast("RATE_LIMITED","15 分钟失败窗口已达到演示上限。",true);refresh();return}
if(!p||p.status!=="active"){failRedeem(uid,"PRODUCT_UNAVAILABLE");refresh();return}
if(m&&(m.status==="left"||m.status==="suspended")){failRedeem(uid,"MEMBERSHIP_"+m.status.toUpperCase(),"产品成员不允许核销，尚未查询码状态。");refresh();return}
const codeId=SECRET.get(entered),c=DB.codes.find(x=>x.id===codeId);
if(!c||c.product!==pid){failRedeem(uid,"REDEEM_CODE_INVALID");refresh();return}
if(DB.redemptions.some(r=>r.code===c.id&&r.user===uid)){S.lastResult="REDEEM_ALREADY_USED";toast("REDEEM_ALREADY_USED","本人已成功兑换过这张码，不重复授予。",true);refresh();return}
const batch=DB.batches.find(b=>b.id===c.batch);
if(c.revoked||batch?.revoked||c.expiry!==null&&c.expiry<=now()||c.used>=c.max){failRedeem(uid,"REDEEM_CODE_INVALID");refresh();return}
if(!m)DB.members.push({id:nid("MB"),user:uid,product:pid,status:"active",before:null});
let start=now(),end=null;
if(c.duration!==null){start=DB.grants.filter(g=>g.user===uid&&g.product===pid&&!g.revoked&&g.end!==null).reduce((t,g)=>Math.max(t,g.end),now());end=start+c.duration*DAY}
const grant={id:nid("GR"),user:uid,product:pid,start,end,revoked:false,source:"code"},red={id:nid("RD"),code:c.id,user:uid,product:pid,time:now(),grant:grant.id};
c.used++;DB.grants.unshift(grant);DB.redemptions.unshift(red);S.lastResult="REDEEM_SUCCESS";
toast("兑换成功 · Pro 已授予",pn(pid)+" · "+(end===null?"永久":date(start)+" 至 "+date(end)));refresh();
}

const f=new FormData(form),email=String(f.get("email")||"").trim().toLowerCase(),password=String(f.get("password")||""),account=DB.users.find(x=>x.email===email);
if(!account||password!=="demo1234"||!account.verified||account.blocked){toast("模拟登录拒绝","邮箱、演示密码、邮箱确认或平台封禁检查未通过。",true);return}
S.actor=account.id;toast("模拟邮箱密码登录成功","仅切换内存用户身份，未创建真实 Auth JWT。");refresh();return
}
if(formId==="form-backup"){
const f=new FormData(form),uid=S.actor,q=qualified(uid,"lens"),payloadText=String(f.get("payload")||""),type=String(f.get("kind")),name=String(f.get("name")||"").trim();
if(!q.ok||q.tier!=="Pro"){toast("403 / PRO_REQUIRED","必须为 AisenLens 的 active 成员且拥有当前有效 Pro。",true);return}
let item;try{item=JSON.parse(payloadText)}catch(e){toast("JSON_INVALID","请输入合法 JSON。",true);return}
const keys=Object.keys(item&&typeof item==="object"&&!Array.isArray(item)?item:{});
const ok=item&&typeof item==="object"&&!Array.isArray(item)&&keys.length>0&&keys.every(k=>["theme","timelineZoom","accent"].includes(k))&&
(item.theme===undefined||["dark","light"].includes(item.theme))&&
(item.timelineZoom===undefined||typeof item.timelineZoom==="number"&&item.timelineZoom>.1&&item.timelineZoom<=4)&&
(item.accent===undefined||typeof item.accent==="string"&&/^#[0-9a-f]{6}$/i.test(item.accent));
const size=new TextEncoder().encode(payloadText).length;
if(!ok||!name||size>2048||!["preferences","layout","preset"].includes(type)){toast("JSON_SCHEMA_REJECTED","超出本演示的受控字段、类型、大小或名称要求。",true);return}
DB.backup.unshift({id:nid("BK"),user:uid,kind:type,name,size,time:now()});toast("SaaS 配置已模拟保存","仅保存轻量元数据到内存；没有触发真实 Edge / R2。");refresh();return
}
});
document.addEventListener("keydown",function(event){
const overlay=document.getElementById("overlay");
if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){
 event.preventDefault();
 if(overlay?.querySelector(".palette"))modalClose();else if(!overlay?.firstElementChild)commandPalette();
 return
}
const palette=overlay?.querySelector(".palette");
if(palette){
 const input=palette.querySelector("#palette-search"),items=[...palette.querySelectorAll(".palette-item")],selected=items.indexOf(document.activeElement);
 if(event.key==="ArrowDown"&&items.length){
  event.preventDefault();items[(selected+1)%items.length].focus();return
 }
 if(event.key==="ArrowUp"&&items.length){
  event.preventDefault();(selected<=0?input:items[selected-1]).focus();return
 }
 if(event.key==="Enter"&&document.activeElement===input&&items.length){
  event.preventDefault();items[0].click();return
 }
}

if(event.key==="Escape"&&overlay?.firstElementChild){modalClose();return}
if(event.key==="Tab"&&overlay?.firstElementChild){
const focusables=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')].filter(x=>x.getClientRects().length);
if(focusables.length){const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault()}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault()}}
}
});
paint();
})();

</script>
