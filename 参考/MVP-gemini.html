<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AisenCore Admin — UI-G0A 全景高保真可交互演示基准</title>
  <style>
    /* ======================================================================
       1. UI-G0 DESIGN TOKENS & FROSTED GLASS LIGHT THEME (DEFAULT)
       ====================================================================== */
    :root {
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", "Cascadia Code", "Consolas", "Liberation Mono", monospace;

      /* Frosted Glass Light Theme (Default) */
      --bg-canvas: linear-gradient(135deg, #F0F5FF 0%, #F5F7FB 45%, #EEF2FF 100%);
      --bg-page: transparent;
      --bg-panel: rgba(255, 255, 255, 0.78);
      --bg-panel-solid: #FFFFFF;
      --bg-panel-hover: rgba(255, 255, 255, 0.92);
      --bg-subtle: rgba(241, 245, 249, 0.72);
      --bg-toolbar: rgba(248, 250, 252, 0.65);
      --bg-appbar: rgba(255, 255, 255, 0.74);
      --bg-sidebar: rgba(255, 255, 255, 0.70);
      --bg-vault: #0B1120;

      --glass-blur: blur(20px) saturate(180%);
      --border-default: rgba(226, 232, 240, 0.85);
      --border-strong: rgba(203, 213, 225, 0.95);
      --border-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.88);
      --shadow-card: 0 10px 30px -10px rgba(15, 23, 42, 0.05), 0 2px 8px -2px rgba(15, 23, 42, 0.025), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --shadow-dialog: 0 24px 60px -12px rgba(15, 23, 42, 0.18), 0 0 1px 1px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.95);

      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;

      --primary-main: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-soft: rgba(37, 99, 235, 0.09);
      --primary-border: rgba(37, 99, 235, 0.24);
      --primary-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);

      /* 4 Semantic Status Tokens (Icon + Text + Soft Bg + 1px Border) */
      --status-active-fg: #15803D;
      --status-active-bg: rgba(240, 253, 244, 0.9);
      --status-active-bd: #BBF7D0;

      --status-warn-fg: #B45309;
      --status-warn-bg: rgba(255, 251, 235, 0.92);
      --status-warn-bd: #FDE68A;

      --status-danger-fg: #B91C1C;
      --status-danger-bg: rgba(254, 242, 242, 0.92);
      --status-danger-bd: #FECACA;

      --status-info-fg: #1D4ED8;
      --status-info-bg: rgba(239, 246, 255, 0.92);
      --status-info-bd: #BFDBFE;

      --radius-control: 8px;
      --radius-card: 14px;
      --radius-dialog: 16px;
      --control-height: 36px;
      --control-height-sm: 30px;
      --row-height: 44px;
    }

    /* Candidate Theme B: Slate Crisp (Zero Blur / 1px Solid Border) */
    .g0a-viewport-frame.theme-slate {
      --bg-canvas: #F8FAFC;
      --bg-panel: #FFFFFF;
      --bg-panel-solid: #FFFFFF;
      --bg-panel-hover: #F8FAFC;
      --bg-subtle: #F1F5F9;
      --bg-toolbar: #FCFDFE;
      --bg-appbar: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --glass-blur: none;
      --border-default: #E2E8F0;
      --border-strong: #CBD5E1;
      --border-highlight: none;
      --shadow-card: none;
      --radius-control: 6px;
      --radius-card: 10px;
      --radius-dialog: 12px;
    }

    /* Candidate Theme C: Radiant 3D (React-admin radiantLightTheme) */
    .g0a-viewport-frame.theme-radiant {
      --bg-canvas: linear-gradient(145deg, #F3F5FC 0%, #EEF2FF 55%, #F5F3FF 100%);
      --bg-panel: rgba(255, 255, 255, 0.94);
      --bg-panel-solid: #FFFFFF;
      --bg-subtle: #EEF2FF;
      --bg-toolbar: #F8FAFF;
      --bg-appbar: rgba(255, 255, 255, 0.9);
      --bg-sidebar: rgba(255, 255, 255, 0.88);
      --border-default: #E0E7FF;
      --border-strong: #C7D2FE;
      --primary-main: #4F46E5;
      --primary-hover: #4338CA;
      --primary-soft: #EEF2FF;
      --primary-border: #C7D2FE;
      --primary-shadow: 0 6px 16px -2px rgba(79, 70, 229, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      --shadow-card: 0 14px 32px -6px rgba(79, 70, 229, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
      --radius-control: 10px;
      --radius-card: 16px;
      --radius-dialog: 20px;
      --control-height: 38px;
      --row-height: 50px;
    }

    /* Candidate Theme D: Dark Frosted Glass */
    .g0a-viewport-frame.theme-dark {
      --bg-canvas: radial-gradient(circle at 15% 15%, #1E293B 0%, #090D16 60%, #060911 100%);
      --bg-panel: rgba(30, 41, 59, 0.72);
      --bg-panel-solid: #1E293B;
      --bg-panel-hover: rgba(51, 65, 85, 0.75);
      --bg-subtle: rgba(15, 23, 42, 0.65);
      --bg-toolbar: rgba(15, 23, 42, 0.55);
      --bg-appbar: rgba(15, 23, 42, 0.78);
      --bg-sidebar: rgba(15, 23, 42, 0.74);
      --border-default: rgba(51, 65, 85, 0.85);
      --border-strong: rgba(71, 85, 105, 0.95);
      --border-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --primary-main: #3B82F6;
      --primary-hover: #60A5FA;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --primary-border: rgba(59, 130, 246, 0.38);
      --status-active-fg: #4ADE80;
      --status-active-bg: rgba(20, 83, 45, 0.45);
      --status-active-bd: rgba(34, 197, 94, 0.4);
      --status-warn-fg: #FBBF24;
      --status-warn-bg: rgba(120, 53, 15, 0.45);
      --status-warn-bd: rgba(245, 158, 11, 0.4);
      --status-danger-fg: #F87171;
      --status-danger-bg: rgba(127, 29, 29, 0.45);
      --status-danger-bd: rgba(239, 68, 68, 0.4);
      --status-info-fg: #60A5FA;
      --status-info-bg: rgba(30, 58, 138, 0.45);
      --status-info-bd: rgba(59, 130, 246, 0.4);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #0F172A;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ======================================================================
       2. OUTER LAYER: 48px BENCHMARK STUDIO BAR (PHYSICAL ISOLATION)
       ====================================================================== */
    .studio-bar {
      position: sticky;
      top: 0;
      z-index: 120;
      min-height: 48px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      color: #F8FAFC;
      border-bottom: 1px solid rgba(51, 65, 85, 0.8);
      padding: 6px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    .studio-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .studio-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.18);
      color: #93C5FD;
      border: 1px solid rgba(59, 130, 246, 0.35);
      white-space: nowrap;
    }

    .studio-segmented {
      display: inline-flex;
      align-items: center;
      background: #1E293B;
      padding: 2px;
      border-radius: 7px;
      border: 1px solid #334155;
    }

    .studio-seg-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #94A3B8;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .studio-seg-btn:hover {
      color: #F8FAFC;
    }

    .studio-seg-btn.active {
      background: #3B82F6;
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .studio-select {
      height: 28px;
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 11.5px;
      font-family: var(--font-sans);
      cursor: pointer;
      outline: none;
    }

    .studio-select.fault-active {
      background: rgba(180, 83, 9, 0.35);
      border-color: #F59E0B;
      color: #FDE68A;
      font-weight: 600;
    }

    .studio-btn {
      appearance: none;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1E293B;
      color: #F8FAFC;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .studio-btn:hover {
      background: #334155;
      border-color: #64748B;
    }

    .studio-btn.guide-cta {
      background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
      border-color: #60A5FA;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    /* ======================================================================
       3. STAGE WRAPPER & FROSTED AMBIENT VIEWPORT FRAME
       ====================================================================== */
    .stage-wrapper {
      padding: 12px 16px 28px;
      min-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 0%, #1E293B 0%, #0B1120 75%);
    }

    .g0a-viewport-frame {
      width: 100%;
      max-width: 1440px;
      min-height: calc(100vh - 76px);
      background: var(--bg-canvas);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      transition: max-width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
    }

    /* Subtle Ambient Light Orbs for Frosted Glass Translucency */
    .g0a-viewport-frame::before,
    .g0a-viewport-frame::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.65;
    }

    .g0a-viewport-frame::before {
      width: 480px;
      height: 480px;
      top: -140px;
      left: -80px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.22) 0%, rgba(147, 197, 253, 0) 70%);
    }

    .g0a-viewport-frame::after {
      width: 520px;
      height: 520px;
      bottom: -160px;
      right: -100px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(165, 180, 252, 0) 70%);
    }

    .g0a-viewport-frame.theme-slate::before,
    .g0a-viewport-frame.theme-slate::after {
      display: none;
    }

    .g0a-viewport-frame.vp-1440 { max-width: 1440px; }
    .g0a-viewport-frame.vp-1280 { max-width: 1280px; }
    .g0a-viewport-frame.vp-820  { max-width: 820px; }
    .g0a-viewport-frame.vp-375  { max-width: 375px; }

    /* ======================================================================
       4. INNER LAYER: AISENCORE ADMIN SHELL (ZERO META NOISE)
       ====================================================================== */
    .admin-appbar {
      height: 60px;
      background: var(--bg-appbar);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-default);
      box-shadow: var(--border-highlight);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .admin-appbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .admin-drawer-toggle {
      display: none;
      appearance: none;
      border: 1px solid var(--border-default);
      background: var(--bg-panel);
      color: var(--text-primary);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-control);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      white-space: nowrap;
      cursor: pointer;
    }

    .admin-brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary-main) 0%, #4F46E5 100%);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      font-family: var(--font-mono);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    /* Product Context Switcher (PREDEV-A01) */
    .context-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-strong);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03), var(--border-highlight);
      padding: 0 10px;
      border-radius: var(--radius-control);
      height: 34px;
      transition: border-color 0.15s;
    }

    .context-switcher:hover {
      border-color: var(--primary-main);
    }

    .context-switcher-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .context-switcher-select {
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      padding-right: 4px;
    }

    .admin-appbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .admin-body {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* Dual-Scope Sidebar (Product Workspace vs Global Platform Control) */
    .admin-sidebar {
      width: 236px;
      background: var(--bg-sidebar);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--border-default);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      user-select: none;
    }

    .nav-section-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 10px 10px 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.03em;
    }

    .nav-scope-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-main);
      border: 1px solid var(--primary-border);
    }

    .nav-scope-pill.global {
      background: var(--status-danger-bg);
      color: var(--status-danger-fg);
      border-color: var(--status-danger-bd);
    }

    .nav-item {
      width: 100%;
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 11px;
      border-radius: var(--radius-control);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      margin-bottom: 3px;
      transition: all 0.14s ease;
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .nav-item-icon {
      font-size: 14px;
      width: 18px;
      text-align: center;
      opacity: 0.85;
    }

    .nav-item:hover {
      background: var(--bg-panel-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-panel-solid);
      color: var(--primary-main);
      border-color: var(--primary-border);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
    }

    .nav-item-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 1px 6px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .nav-item.active .nav-item-count {
      background: var(--primary-soft);
      color: var(--primary-main);
      font-weight: 600;
    }

    .nav-divider {
      height: 1px;
      background: var(--border-default);
      margin: 10px 8px;
    }

    .admin-main {
      flex: 1;
      min-width: 0;
      padding: 22px 26px 36px;
      overflow-x: hidden;
    }

    /* ======================================================================
       5. FROSTED GLASS CARDS, TABLES, BADGES & CONTROLS
       ====================================================================== */
    .breadcrumb {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 22px;
      font-weight: 650;
      line-height: 1.3;
      color: var(--text-primary);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      letter-spacing: -0.015em;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .surface-card {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .surface-card-header {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .surface-card-body {
      padding: 16px 18px;
    }

    .filter-toolbar {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border-default);
      background: var(--bg-toolbar);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Buttons & Inputs (36px standard height, crisp focus ring) */
    .btn {
      appearance: none;
      height: var(--control-height);
      padding: 0 14px;
      border-radius: var(--radius-control);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.14s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn:focus-visible, .input:focus-visible, .select:focus-visible, .textarea:focus-visible {
      outline: 2px solid var(--primary-main);
      outline-offset: 2px;
    }

    .btn-sm {
      height: var(--control-height-sm);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-primary {
      background: var(--primary-main);
      color: #FFFFFF;
      border: 1px solid var(--primary-main);
      box-shadow: var(--primary-shadow);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-0.5px);
    }

    .btn-secondary {
      background: var(--bg-panel-solid);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: var(--text-muted);
    }

    /* L2 Blast Radius: Product-Scoped Warning Button (Amber) */
    .btn-warning {
      background: var(--status-warn-bg);
      color: var(--status-warn-fg);
      border: 1px solid var(--status-warn-bd);
    }

    .btn-warning:hover:not(:disabled) {
      filter: brightness(0.96);
    }

    /* L3 Blast Radius: Global Platform Danger Button (Crimson) */
    .btn-danger {
      background: var(--status-danger-bg);
      color: var(--status-danger-fg);
      border: 1px solid var(--status-danger-bd);
    }

    .btn-danger:hover:not(:disabled) {
      filter: brightness(0.96);
    }

    .btn-danger-solid {
      background: #DC2626;
      color: #FFFFFF;
      border: 1px solid #B91C1C;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .btn-danger-solid:hover:not(:disabled) {
      background: #B91C1C;
    }

    .input, .select {
      height: var(--control-height);
      padding: 0 11px;
      border-radius: var(--radius-control);
      border: 1px solid var(--border-strong);
      background: var(--bg-panel-solid);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .textarea {
      padding: 8px 11px;
      border-radius: var(--radius-control);
      border: 1px solid var(--border-strong);
      background: var(--bg-panel-solid);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
      width: 100%;
      resize: vertical;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--primary-main);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .input[readonly], .input:disabled, .select:disabled {
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .input-mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
    }

    /* Data Table (44px row height, tabular-nums, local horizontal scroll) */
    .table-scroll-container {
      width: 100%;
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    .data-table th {
      height: 38px;
      padding: 0 14px;
      text-align: left;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-default);
      white-space: nowrap;
    }

    .data-table td {
      height: var(--row-height);
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-default);
      vertical-align: middle;
      white-space: nowrap;
    }

    .data-table tbody tr {
      transition: background 0.12s;
    }

    .data-table tbody tr:hover {
      background: var(--bg-panel-hover);
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .table-footer {
      padding: 10px 16px;
      background: var(--bg-toolbar);
      border-top: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* 4 Semantic Status Badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 23px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .status-active {
      color: var(--status-active-fg);
      background: var(--status-active-bg);
      border: 1px solid var(--status-active-bd);
    }

    .status-warn {
      color: var(--status-warn-fg);
      background: var(--status-warn-bg);
      border: 1px solid var(--status-warn-bd);
    }

    .status-danger {
      color: var(--status-danger-fg);
      background: var(--status-danger-bg);
      border: 1px solid var(--status-danger-bd);
    }

    .status-info {
      color: var(--status-info-fg);
      background: var(--status-info-bg);
      border: 1px solid var(--status-info-bd);
    }

    .status-neutral {
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
    }

    /* UUID Copy Chip & Capability Key Tag */
    .uuid-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.12s;
      font-variant-numeric: tabular-nums;
    }

    .uuid-chip:hover {
      color: var(--primary-main);
      border-color: var(--primary-border);
      background: var(--primary-soft);
    }

    .key-tag {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--status-info-fg);
      background: var(--status-info-bg);
      border: 1px solid var(--status-info-bd);
      padding: 1px 7px;
      border-radius: 5px;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    /* Module Sub-Tabs */
    .module-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border-default);
      padding: 0 16px;
      background: var(--bg-toolbar);
      overflow-x: auto;
    }

    .module-tab {
      appearance: none;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      padding: 11px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: color 0.14s;
    }

    .module-tab:hover {
      color: var(--text-primary);
    }

    .module-tab.active {
      color: var(--primary-main);
      border-bottom-color: var(--primary-main);
    }

    /* Grids */
    .grid-2col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-4col {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    /* One-Time Plaintext Vault Box (M3 Security Pattern) */
    .vault-box {
      background: var(--bg-vault);
      color: #F8FAFC;
      border-radius: 10px;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.75;
      border: 1px solid #334155;
      max-height: 220px;
      overflow-y: auto;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Segmented Mode Cards for DEC-05 Grant Entitlement */
    .segmented-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .seg-card {
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 11px 12px;
      cursor: pointer;
      background: var(--bg-panel-solid);
      text-align: left;
      transition: all 0.15s;
    }

    .seg-card:hover {
      border-color: var(--primary-main);
    }

    .seg-card.active {
      border-color: var(--primary-main);
      background: var(--primary-soft);
      box-shadow: inset 0 0 0 1px var(--primary-main);
    }

    .seg-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .seg-card-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    /* Centered Auth / MFA Gate Stage (No Admin Shell per UI-G0 §4.2) */
    .mfa-auth-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      min-height: 640px;
    }

    .mfa-card {
      width: 100%;
      max-width: 430px;
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-dialog);
      box-shadow: var(--shadow-dialog);
      padding: 28px 26px;
    }

    /* Modals & Slide-Over Drawers */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      background: var(--bg-panel-solid);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-dialog);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-dialog);
      color: var(--text-primary);
    }

    .modal-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-body {
      padding: 18px 20px;
    }

    .modal-footer {
      padding: 13px 20px;
      border-top: 1px solid var(--border-default);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-field {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    /* Slide-over Drawer (Used for Playbooks Guide & Membership Events Timeline) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 210;
      background: rgba(15, 23, 42, 0.38);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: flex-end;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-panel {
      width: min(500px, 100vw);
      height: 100%;
      background: var(--bg-panel-solid);
      border-left: 1px solid var(--border-strong);
      box-shadow: -16px 0 48px rgba(15, 23, 42, 0.22);
      display: flex;
      flex-direction: column;
      color: var(--text-primary);
    }

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .playbook-card {
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: 13px 14px;
      margin-bottom: 12px;
      background: var(--bg-subtle);
    }

    .playbook-card h4 {
      margin: 0 0 6px 0;
      font-size: 13.5px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .playbook-card ol {
      margin: 6px 0 10px 0;
      padding-left: 18px;
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(420px, calc(100vw - 32px));
    }

    .toast-item {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      color: #F8FAFC;
      border: 1px solid rgba(71, 85, 105, 0.8);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Responsive Breakpoints inside Simulated Viewport Frame (UI-G0 §3.2) */
    .g0a-viewport-frame.vp-820 .admin-sidebar,
    .g0a-viewport-frame.vp-375 .admin-sidebar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      background: var(--bg-panel-solid);
      box-shadow: 12px 0 32px rgba(15, 23, 42, 0.18);
      transform: translateX(-105%);
      transition: transform 0.22s ease;
    }

    .g0a-viewport-frame.vp-820 .admin-sidebar.drawer-open,
    .g0a-viewport-frame.vp-375 .admin-sidebar.drawer-open {
      transform: translateX(0);
    }

    .g0a-viewport-frame.vp-820 .admin-drawer-toggle,
    .g0a-viewport-frame.vp-375 .admin-drawer-toggle {
      display: inline-flex;
    }

    .g0a-viewport-frame.vp-375 .admin-appbar {
      padding: 0 12px;
    }

    .g0a-viewport-frame.vp-375 .hide-on-xs {
      display: none !important;
    }

    .g0a-viewport-frame.vp-375 .context-switcher-label {
      display: none;
    }

    .g0a-viewport-frame.vp-375 .admin-main {
      padding: 14px 12px 28px;
    }

    .g0a-viewport-frame.vp-375 .page-header {
      flex-direction: column;
      align-items: stretch;
    }

    .g0a-viewport-frame.vp-375 .page-header .header-actions,
    .g0a-viewport-frame.vp-375 .page-header .btn {
      width: 100%;
    }

    .g0a-viewport-frame.vp-375 .grid-2col,
    .g0a-viewport-frame.vp-375 .grid-3col,
    .g0a-viewport-frame.vp-375 .grid-4col,
    .g0a-viewport-frame.vp-375 .segmented-cards {
      grid-template-columns: 1fr !important;
    }
  </style>
</head>
<body>

  <!-- ====================================================================
       OUTER LAYER: 48px BENCHMARK STUDIO BAR (PHYSICAL ISOLATION)
       ==================================================================== -->
  <header class="studio-bar" aria-label="原型实验室控制栏">
    <div class="studio-group">
      <strong style="font-size:12.5px; letter-spacing:-0.01em; color:#FFFFFF;">AisenCore UI-G0A 交互基准</strong>
      <span class="studio-pill">本地内存态 · UI-G0A 待签收</span>

      <!-- Theme Switcher -->
      <div class="studio-segmented" role="group" aria-label="候选主题切换">
        <button type="button" class="studio-seg-btn active" data-theme="frosted" onclick="setVisualTheme('frosted')">✨ 轻磨砂玻璃 (Frosted)</button>
        <button type="button" class="studio-seg-btn" data-theme="slate" onclick="setVisualTheme('slate')">Slate 细边框</button>
        <button type="button" class="studio-seg-btn" data-theme="radiant" onclick="setVisualTheme('radiant')">Radiant 立体</button>
        <button type="button" class="studio-seg-btn" data-theme="dark" onclick="setVisualTheme('dark')">Dark 暗色</button>
      </div>

      <!-- Viewport Width Switcher -->
      <div class="studio-segmented" role="group" aria-label="视口宽度切换">
        <button type="button" class="studio-seg-btn active" data-vp="1440" onclick="setViewport('1440')">1440px</button>
        <button type="button" class="studio-seg-btn" data-vp="1280" onclick="setViewport('1280')">1280px</button>
        <button type="button" class="studio-seg-btn" data-vp="820" onclick="setViewport('820')">820px 平板</button>
        <button type="button" class="studio-seg-btn" data-vp="375" onclick="setViewport('375')">375px 手机</button>
      </div>
    </div>

    <div class="studio-group">
      <!-- Fault & Network Injection -->
      <label for="studio-fault-select" style="color:#94A3B8; font-size:11.5px;">写操作模拟:</label>
      <select id="studio-fault-select" class="studio-select" onchange="setFaultMode(this.value)" aria-label="写操作异常注入">
        <option value="normal">✓ 正常响应 (200 OK)</option>
        <option value="unknown_created">⚠ 超时 UNKNOWN (已落库但丢明文)</option>
        <option value="unknown_none">⚠ 超时 UNKNOWN (未落库可安全重放)</option>
        <option value="conflict_409">✕ 409 STATE_CONFLICT (同键异参冲突)</option>
        <option value="rate_429">⏳ 429 RATE_LIMITED (触发限流)</option>
        <option value="unavail_503">🔌 503 SERVICE_UNAVAILABLE (服务暂不可用)</option>
      </select>

      <button type="button" class="studio-btn" onclick="openClientRedeemSimulatorModal()" title="模拟客户端调用 redeem_code(product_key, code) 核销已发出的兑换码">🧪 模拟客户端兑码</button>
      <button type="button" class="studio-btn guide-cta" onclick="openPlaybooksDrawer()">📖 怎么体验 (5 剧本)</button>
      <button type="button" class="studio-btn" onclick="resetAllState()">↺ 重置数据</button>
    </div>
  </header>

  <!-- ====================================================================
       STAGE WRAPPER & SIMULATED VIEWPORT FRAME
       ==================================================================== -->
  <div class="stage-wrapper">
    <div id="viewport-frame" class="g0a-viewport-frame vp-1440 theme-frosted">

      <!-- ================================================================
           VIEW 0: AUTH & TOTP MFA GATE SHELL (NO SIDEBAR PER UI-G0 §4.2)
           ================================================================ -->
      <div id="auth-gate-shell" style="display:none; flex:1; flex-direction:column;">
        <div style="background:var(--bg-appbar); backdrop-filter:var(--glass-blur); border-bottom:1px solid var(--border-default); padding:10px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <div class="admin-brand" onclick="navigateModule('workspace')">
            <span class="admin-brand-mark">AC</span>
            <span>AisenCore Identity &amp; MFA Gate</span>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            <button type="button" class="btn btn-sm btn-secondary" onclick="setMfaSubView('login')">1. 邮箱密码登录 (aal1)</button>
            <button type="button" class="btn btn-sm btn-secondary" onclick="setMfaSubView('enroll')">2. 首次双设备 QR 绑定 (A-04)</button>
            <button type="button" class="btn btn-sm btn-primary" onclick="setMfaSubView('challenge')">3. TOTP 6 位码验证 (→aal2)</button>
            <button type="button" class="btn btn-sm btn-danger" onclick="setMfaSubView('denied_403')">4. 403 权限拒绝</button>
            <button type="button" class="btn btn-sm btn-warning" onclick="setMfaSubView('fault_503')">5. 503 故障区分</button>
          </div>
        </div>

        <div class="mfa-auth-stage">
          <div id="mfa-card-container" class="mfa-card"></div>
        </div>
      </div>

      <!-- ================================================================
           VIEW 1~6: PROTECTED ADMIN SHELL (AAL2 VERIFIED)
           ================================================================ -->
      <div id="admin-protected-shell" style="display:flex; flex:1; flex-direction:column;">

        <!-- Global Admin AppBar (60px) -->
        <header class="admin-appbar">
          <div class="admin-appbar-left">
            <button type="button" class="admin-drawer-toggle" onclick="toggleMobileSidebar()" aria-label="展开或收起导航菜单">☰</button>
            <div class="admin-brand" onclick="navigateModule('workspace')">
              <span class="admin-brand-mark">AC</span>
              <span>AisenCore Admin</span>
            </div>

            <!-- Product Context Switcher (PREDEV-A01) -->
            <div class="context-switcher" title="切换当前产品运营空间或全平台视角">
              <span class="context-switcher-label">当前产品空间:</span>
              <select id="product-context-select" class="context-switcher-select" aria-label="选择当前产品空间" onchange="switchProductContext(this.value)"></select>
            </div>
          </div>

          <div class="admin-appbar-right">
            <span id="appbar-fault-badge" class="status-badge status-warn" style="display:none;"></span>
            <span class="status-badge status-active hide-on-xs" title="JWT aal2 已验证，min_valid_iat 校验有效">✓ MFA: AAL2</span>
            <span class="uuid-chip hide-on-xs" onclick="copyText('owner@aisen.com', '已复制管理员邮箱')">owner@aisen.com</span>
            <button type="button" class="btn btn-sm btn-secondary" onclick="navigateModule('mfa')">切换/锁定会话</button>
          </div>
        </header>

        <!-- Admin Body: Dual-Scope Sidebar + Dynamic Main Canvas -->
        <div class="admin-body">
          <aside id="admin-sidebar" class="admin-sidebar" aria-label="Admin 主导航"></aside>
          <main id="admin-main-canvas" class="admin-main" tabindex="-1"></main>
        </div>
      </div>

    </div>
  </div>

  <!-- ====================================================================
       UNIVERSAL MODAL DIALOG
       ==================================================================== -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">操作确认</h3>
        <button type="button" id="modal-close-x" class="btn btn-sm btn-secondary" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- ====================================================================
       SLIDE-OVER DRAWER (PLAYBOOKS WALKTHROUGH & MEMBERSHIP EVENTS)
       ==================================================================== -->
  <div id="drawer-backdrop" class="drawer-backdrop" role="dialog" aria-modal="true" aria-labelledby="drawer-title" onclick="handleDrawerBackdropClick(event)">
    <aside class="drawer-panel" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <div>
          <div id="drawer-eyebrow" style="font-size:11px; font-weight:700; color:var(--primary-main); letter-spacing:0.04em;">INTERACTIVE WALKTHROUGH</div>
          <h3 id="drawer-title" style="margin:2px 0 0 0; font-size:16px; font-weight:650;">怎么体验</h3>
        </div>

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function shortUuid(uuid) {
      if (!uuid || uuid.length < 12) return uuid;
      return `${uuid.slice(0, 6)}…${uuid.slice(-4)}`;
    }

    function nowUtcString() {
      const d = new Date();
      return d.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
    }

    function addDaysToDateStr(baseDateStr, days) {
      const clean = String(baseDateStr || '').replace(' UTC', 'Z').replace(' ', 'T');
      const baseMs = Date.parse(clean);
      const startMs = Number.isNaN(baseMs) ? Date.now() : baseMs;
      const endMs = startMs + Number(days) * 86400000;
      return new Date(endMs).toISOString().slice(0, 10) + ' 00:00 UTC';
    }

    function getUserById(uid) {

    function showToast(msg, tone = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const item = document.createElement('div');
      item.className = 'toast-item';
      const icon = tone === 'danger' ? '<span style="color:#F87171;">✕</span>'
                 : tone === 'warn'   ? '<span style="color:#FBBF24;">⚠</span>'
                 : '<span style="color:#4ADE80;">✓</span>';
      item.innerHTML = `${icon}<span>${esc(msg)}</span>`;
      container.appendChild(item);
      setTimeout(() => {
        if (item.parentNode) item.parentNode.removeChild(item);
      }, 3200);
    }

    function copyText(text, labelMsg) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
      } catch (e) {}
      showToast(labelMsg || `已复制: ${text}`);
    }

    function downloadTextFile(filename, content) {
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 250);
      showToast(`已生成并下载: ${filename}`);
    }

      return false;

      state.visualTheme = keepTheme;

      const freePlans = state.plans.filter((p) => p.product_key === prod.product_key && p.plan_family === 'free' && p.is_active);
      const opts = freePlans.map((p) => `
        <option value="${esc(p.id)}" ${p.id === prod.current_free_plan_id ? 'selected' : ''}>
          ${esc(p.plan_key)} — ${esc(p.name)} [Features: ${esc(p.features.join(', '))}]
        </option>
      `).join('');

      const body = `
        <div style="background:var(--status-warn-bg); border:1px solid var(--status-warn-bd); padding:11px 14px; border-radius:8px; margin-bottom:14px; font-size:12.5px; color:var(--status-warn-fg);">
          <strong>⚠ 单产品级影响范围（admin_set_default_free_plan）</strong>：仅允许指向当前产品 <strong>[${esc(prod.product_key)}]</strong> 下 <code>plan_family='free'</code> 的不可变版本。切换后新老用户下次 <code>check_access</code> 将立即合并新版 Free 能力。
        </div>
        <div class="form-field">
          <label class="form-label" for="modal-free-pointer-sel">目标 Free 家族版本 *</label>

        </div>
        <div class="form-field" style="margin-bottom:0;">
          <label class="form-label" for="modal-free-pointer-reason">切换原因 (写入 admin_audit_log，必填) *</label>
          <input id="modal-free-pointer-reason" type="text" class="input" value="升级默认 Free 基础能力，开放模板导入" style="width:100%;" />
        </div>
      `;
      const footer = `
        <button type="button" class="btn btn-secondary" data-autofocus="true" onclick="closeModal()">取消</button>
        <button type="button" class="btn btn-primary" onclick="confirmSwitchFreePointer('${esc(prod.product_key)}')">确认切换默认 Free 指针</button>
      `;
      openModal(`切换产品默认 Free 指针 (${prod.name})`, body, footer);
    }

    function confirmSwitchFreePointer(prodKey) {
      if (checkInjectedFaultBeforeWrite()) return;
      const sel = document.getElementById('modal-free-pointer-sel');
      const reasonEl = document.getElementById('modal-free-pointer-reason');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if (!reason) {
        showToast('请填写切换原因', 'warn');
        return;
      }
      const prod = getProductByKey(prodKey);
      const oldId = prod.current_free_plan_id;
      const newId = sel ? sel.value : oldId;
      prod.current_free_plan_id = newId;
      appendAuditLog('admin_set_default_free_plan', `product:${prod.product_key}`, `product:${prod.product_key}`, {
        old_free_plan: oldId,
        new_free_plan: newId,
        reason
      });
      closeModal();
      renderAll();
      showToast(`已将 ${prod.name} 默认 Free 指针切换至 ${newId}`);
    }

    function openClonePlanModal(sourcePlanId) {
      const src = state.plans.find((p) => p.id === sourcePlanId) || state.plans[2];
      const baseKey = src.plan_key.replace(/_v\d+$/, '');
      const nextVersionNum = state.plans.filter((p) => p.product_key === src.product_key && p.plan_key.startsWith(baseKey)).length + 1;
      const suggestedKey = `${baseKey}_v${nextVersionNum}`;

      const presetFeatures = ['ai.analysis', 'video.export.no_watermark', 'backup.config', 'ai.batch_subtitles', 'local.cut.basic', 'template.import'];
      const featureCheckboxes = presetFeatures.map((fKey) => {
        const checked = src.features.includes(fKey) || fKey === 'ai.batch_subtitles';
        return `
          <label style="display:inline-flex; align-items:center; gap:6px; padding:5px 9px; background:var(--bg-panel-solid); border:1px solid var(--border-default); border-radius:6px; font-family:var(--font-mono); font-size:12px; cursor:pointer;">
            <input type="checkbox" name="clone-feature-chk" value="${esc(fKey)}" ${checked ? 'checked' : ''} />
            <span>${esc(fKey)}</span>
          </label>
        `;
      }).join('');

      const curMaxBytes = (src.limits && src.limits['backup.max_bytes']) ? src.limits['backup.max_bytes'] : 524288;
      const curMaxVers = (src.limits && src.limits['backup.max_versions']) ? src.limits['backup.max_versions'] : 20;

      const body = `
        <div style="background:var(--status-info-bg); border:1px solid var(--status-info-bd); padding:10px 12px; border-radius:8px; margin-bottom:14px; font-size:12.5px; color:var(--status-info-fg);">
          <strong>基于套餐 <code>${esc(src.plan_key)}</code> 克隆新版本（M2 结构化键值防错）</strong>：系统已预填原套餐能力与配额。新版本创建后作为独立 <code>plan_key</code> 入库，原被引用套餐的历史授权与兑换码保持不变。
        </div>
        <div class="grid-2col">
          <div class="form-field">
            <label class="form-label" for="clone-plan-key">新套餐版本键 (plan_key，小写字母/数字/下划线) *</label>
            <input id="clone-plan-key" type="text" class="input input-mono" value="${esc(suggestedKey)}" style="width:100%;" />
          </div>
          <div class="form-field">
            <label class="form-label" for="clone-plan-name">展示名称 (name) *</label>
            <input id="clone-plan-name" type="text" class="input" value="${esc(src.name.replace(/\s*\(v\d+.*\)$/, ''))} (v${nextVersionNum} 扩容版)" style="width:100%;" />
          </div>
        </div>
        <div class="grid-2col">
          <div class="form-field">
            <label class="form-label" for="clone-plan-family">套餐家族 (plan_family)</label>
            <input id="clone-plan-family" type="text" class="input input-mono" value="${esc(src.plan_family)}" readonly style="width:100%;" />
          </div>
          <div class="form-field">
            <label class="form-label" for="clone-plan-days">默认授权天数 (default_duration_days)</label>
            <input id="clone-plan-days" type="number" class="input input-mono" value="${src.default_duration_days || 365}" ${src.plan_family === 'free' ? 'readonly' : ''} style="width:100%;" />
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">结构化功能开关选择器 (features JSON Array，严禁与 limits 同名) *</label>
          <div style="display:flex; flex-wrap:wrap; gap:8px; padding:10px; border:1px solid var(--border-default); border-radius:8px; background:var(--bg-subtle);">
            ${featureCheckboxes}
          </div>
        </div>
        <div class="grid-2col">
          <div class="form-field">
            <label class="form-label" for="clone-limit-bytes">配额键: backup.max_bytes (字节上限)</label>
            <input id="clone-limit-bytes" type="number" class="input input-mono" value="${curMaxBytes * 2}" style="width:100%;" />
          </div>
          <div class="form-field">
            <label class="form-label" for="clone-limit-vers">配额键: backup.max_versions (保留版本数)</label>
            <input id="clone-limit-vers" type="number" class="input input-mono" value="${curMaxVers + 10}" style="width:100%;" />
          </div>
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; cursor:pointer;">
          <input id="clone-deactivate-old" type="checkbox" />
          <span>创建新版本后，同时将原套餐 <code>${esc(src.plan_key)}</code> 设为停用（不影响已发出旧码继续核销）</span>
        </label>
      `;

      const footer = `
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="button" class="btn btn-primary" onclick="confirmClonePlan('${esc(src.id)}')">全字段提交创建新版本 (admin_upsert_plan)</button>
      `;
      openModal(`克隆创建新套餐版本 (源: ${src.plan_key})`, body, footer);
    }

    function confirmClonePlan(srcId) {
      if (checkInjectedFaultBeforeWrite()) return;
      const src = state.plans.find((p) => p.id === srcId) || state.plans[2];
      const keyEl = document.getElementById('clone-plan-key');
      const nameEl = document.getElementById('clone-plan-name');
      const daysEl = document.getElementById('clone-plan-days');
      const bytesEl = document.getElementById('clone-limit-bytes');
      const versEl = document.getElementById('clone-limit-vers');
      const deactOldEl = document.getElementById('clone-deactivate-old');

      const newKey = keyEl ? keyEl.value.trim().toLowerCase() : '';
      const newName = nameEl ? nameEl.value.trim() : '';
      if (!/^[a-z][a-z0-9_]{2,40}$/.test(newKey) || !newName) {
        showToast('请填写合法的 plan_key（小写字母开头）与展示名称', 'warn');
        return;
      }
      if (state.plans.some((p) => p.product_key === src.product_key && p.plan_key === newKey)) {
        showToast(`409 STATE_CONFLICT：套餐键 ${newKey} 已存在，请使用新的版本号`, 'danger');
        return;
      }

      const selectedFeatures = Array.from(document.querySelectorAll('input[name="clone-feature-chk"]:checked')).map((el) => el.value);
      if (selectedFeatures.length === 0) {
        showToast('请至少勾选一项功能开关 (features)', 'warn');
        return;
      }

      const newLimits = {
        'backup.max_bytes': Math.max(0, Number(bytesEl?.value || 524288)),
        'backup.max_versions': Math.max(1, Number(versEl?.value || 20))
      };

      const newPlan = {
        id: newKey,
        product_key: src.product_key,
        plan_family: src.plan_family,
        plan_key: newKey,
        name: newName,
        features: selectedFeatures,
        limits: newLimits,
        default_duration_days: src.plan_family === 'free' ? null : Math.max(1, Number(daysEl?.value || 365)),
        is_active: true,
        is_frozen: src.plan_family === 'free',
        ref_codes_count: 0,
        ref_grants_count: 0
      };

      state.plans.push(newPlan);
      if (deactOldEl && deactOldEl.checked) {
        src.is_active = false;
      }

      appendAuditLog('admin_upsert_plan', `product:${src.product_key}`, `plan:${newKey}`, {
        cloned_from: src.plan_key,
        features: selectedFeatures,
        limits: newLimits,
        deactivated_source: !!(deactOldEl && deactOldEl.checked)
      });

      closeModal();
      renderAll();
      showToast(`已创建新套餐版本 ${newKey}，现在可在发码与直授中选择该套餐`);
    }

    function confirmEditPlan(planId) {
      if (checkInjectedFaultBeforeWrite()) return;
      const p = state.plans.find((x) => x.id === planId);
      if (!p) return;
      const nameEl = document.getElementById('edit-plan-name');
      const activeEl = document.getElementById('edit-plan-active');
      const newName = nameEl ? nameEl.value.trim() : p.name;
      if (!newName) {
        showToast('展示名称不能为空', 'warn');
        return;
      }
      const newActive = activeEl ? activeEl.value === 'true' : p.is_active;
      const oldState = { name: p.name, is_active: p.is_active };
      p.name = newName;
      p.is_active = newActive;

      appendAuditLog('admin_upsert_plan', `product:${p.product_key}`, `plan:${p.plan_key}`, {
        before: oldState,
        after: { name: newName, is_active: newActive }
      });

      closeModal();
      renderAll();
      showToast(`已更新套餐 ${p.plan_key}（is_active=${newActive}）`);

    function triggerDemoUnknownScenario() {
      const targetProd = state.productContext === 'all' ? 'aisenlens' : state.productContext;
      const reqId = 'req-unknown-' + Math.random().toString(36).slice(2, 8);
      state.pendingCodeIntent = {
        request_id: reqId,
        product_key: targetProd,
        plan_key: 'pro_365d_v1',
        quantity: 3,
        max_redemptions: 1,
        grant_duration_days: 365,
        expires_at: '2027-12-31 23:59 UTC',
        fault_type: 'unknown_created',
        status: 'unqueried',
        created_batch_id: null
      };
      try {
        sessionStorage.setItem(PENDING_CODE_STORAGE_KEY, JSON.stringify(state.pendingCodeIntent));
      } catch (e) {}
      state.codesTab = 'batches';
      renderAll();
      showToast('已模拟网络超时 UNKNOWN 挂起意图，请点击横幅中的 [1. 按原 request_id 核查批次状态]', 'warn');
    }

    function queryPendingUnknownCodeIntent() {
      const intent = state.pendingCodeIntent;
      if (!intent) return;

      if (intent.fault_type === 'unknown_none') {
        intent.status = 'not_created';
        try { sessionStorage.setItem(PENDING_CODE_STORAGE_KEY, JSON.stringify(intent)); } catch (e) {}
        renderAll();
        showToast('核查完毕：服务端尚未落库，可安全重放');
        return;
      }

      // Default: unknown_created -> Batch was created on server during timeout, plaintext lost
      let batchId = intent.created_batch_id;
      if (!batchId) {
        batchId = 'b-lost-' + intent.request_id.slice(-6) + '-99a1';
        intent.created_batch_id = batchId;
        state.batches.unshift({
          id: batchId,
          product_key: intent.product_key,
          plan_key: intent.plan_key,
          quantity: intent.quantity,
          max_redemptions: intent.max_redemptions,
          grant_duration_days: intent.grant_duration_days,
          expires_at: intent.expires_at,
          created_at: nowUtcString(),
          request_id: intent.request_id,
          status: 'active'
        });
        for (let i = 1; i <= intent.quantity; i++) {
          state.codes.unshift({
            id: `c-lost-${intent.request_id.slice(-4)}-0${i}`,
            batch_id: batchId,
            seq: i,
            product_key: intent.product_key,
            plan_key: intent.plan_key,
            redeemed_count: 0,
            max_redemptions: intent.max_redemptions,
            status: 'available',
            demo_token: null
          });
        }
        const p = getPlanByKey(intent.plan_key);
        if (p) {
          p.is_frozen = true;
          p.ref_codes_count = (p.ref_codes_count || 0) + 1;
        }
        appendAuditLog('admin_create_codes (recovered_status)', `product:${intent.product_key}`, `batch:${shortUuid(batchId)}`, {
          request_id: intent.request_id,
          created: false,

    function submitCreateCodesBatch(prodKey, planKey, qty, maxRed, days, exp, reqId) {
      if (checkInjectedFaultBeforeWrite()) return;

      if (state.faultMode === 'conflict_409') {
        closeModal();
        showToast('409 STATE_CONFLICT：检测到相同 request_id 携带了不一致的套餐或数量参数，服务端拒绝覆盖！', 'danger');
        return;
      }

      if (state.faultMode === 'unknown_created' || state.faultMode === 'unknown_none') {
        state.pendingCodeIntent = {
          request_id: reqId,
          product_key: prodKey,
          plan_key: planKey,
          quantity: qty,
          max_redemptions: maxRed,
          grant_duration_days: days,
          expires_at: exp,
          fault_type: state.faultMode,
          status: 'unqueried',
          created_batch_id: null
        };
        try {
          sessionStorage.setItem(PENDING_CODE_STORAGE_KEY, JSON.stringify(state.pendingCodeIntent));
        } catch (e) {}
        closeModal();
        state.codesTab = 'batches';
        renderAll();
        showToast('请求响应超时 (UNKNOWN)！非秘密 request_id 已保存在 sessionStorage，请按横幅指引先核查状态', 'warn');
        return;
      }

      closeModal();
      executeBatchCreationInMemory(prodKey, planKey, qty, maxRed, days, exp, reqId);
    }

    function executeBatchCreationInMemory(prodKey, planKey, qty, maxRed, days, exp, reqId) {
      const newBatchId = `${Math.random().toString(16).slice(2, 10)}-4a12-9011-${Math.random().toString(16).slice(2, 14)}`;
      const batchRecord = {
        id: newBatchId,
        product_key: prodKey,
        plan_key: planKey,
        quantity: qty,
        max_redemptions: maxRed,
        grant_duration_days: days,
        expires_at: exp,
        created_at: nowUtcString(),
        request_id: reqId,
        status: 'active'
      };
      state.batches.unshift(batchRecord);

      const generatedPlaintexts = [];
      const shortPrefix = prodKey === 'aisenlens' ? 'LENS' : 'NOTE';
      for (let i = 1; i <= qty; i++) {
        const randSeg1 = Math.random().toString(36).substring(2, 6).toUpperCase();
        const randSeg2 = Math.random().toString(36).substring(2, 6).toUpperCase();
        const plain = `AC-${shortPrefix}-${days}D-${randSeg1}-${randSeg2}-${String(i).padStart(2, '0')}`;
        generatedPlaintexts.push(plain);

        state.codes.unshift({
          id: `c-${newBatchId.slice(0, 4)}-0${i}`,
          batch_id: newBatchId,
          seq: i,
          product_key: prodKey,
          plan_key: planKey,
          redeemed_count: 0,
          max_redemptions: maxRed,
          status: 'available',
          demo_token: plain
        });
      }

      const planObj = getPlanByKey(planKey);
      if (planObj) {
        planObj.is_frozen = true;
        planObj.ref_codes_count = (planObj.ref_codes_count || 0) + 1;
      }

      appendAuditLog('admin_create_codes', `product:${prodKey}`, `batch:${shortUuid(newBatchId)}`, {
        plan_key: planKey,
        quantity: qty,
        grant_duration_days: days,
        request_id: reqId
      });

      state.activePlaintextSecret = {
        batch_id: newBatchId,
        product_key: prodKey,
        plan_key: planKey,
        quantity: qty,
        grant_duration_days: days,
        expires_at: exp,
        created_at: batchRecord.created_at,
        codes: generatedPlaintexts
      };

      renderAll();
      openOneTimePlaintextVaultModal();
    }

    function getGrantStatusInfo(g) {
      if (g.revoked_at) {
        return { key: 'revoked', badge: `<span class="status-badge status-danger">✕ 已撤销 (${esc(g.revoke_reason || 'admin')})</span>` };
      }
      if (!g.ends_at) {

      }
      if (String(g.starts_at) > '2026-10-25') {
        return { key: 'scheduled', badge: `<span class="status-badge status-info">● 待生效顺延 Scheduled</span>` };
      }
      return { key: 'active', badge: `<span class="status-badge status-active">✓ 生效中 Active</span>` };
    }

    function computeUserPlanLatestEndsAt(userId, productKey, planKey) {
      const matching = state.grants.filter(
        (g) => g.user_id === userId && g.product_key === productKey && g.plan_key === planKey && !g.revoked_at
      );
      if (matching.some((g) => !g.ends_at)) {
        return 'LIFETIME';
      }
      let latest = '2026-10-22 00:00 UTC';
      matching.forEach((g) => {
        if (g.ends_at && String(g.ends_at) > latest) {
          latest = g.ends_at;
        }
      });
      return latest;
    }

                <option value="active" ${state.grantsStatusFilter === 'active' ? 'selected' : ''}>生效中 (Active)</option>

        user_id: lockedUserId || state.selectedUserId || 'u-wang',

        plan_key: firstPlanKey,

        reason: '客诉补偿 / 线下大客户人工开通',

    function updateGrantDraftField(field, val) {
      state.grantDraft[field] = val;
      const bodyEl = document.getElementById('modal-body');
      if (bodyEl) bodyEl.innerHTML = buildGrantModalBodyHtml();
    }

    function confirmSubmitGrantEntitlement() {
      if (checkInjectedFaultBeforeWrite()) return;
      if (state.faultMode === 'conflict_409') {
        closeModal();
        showToast('409 STATE_CONFLICT：同一 source_ref 检测到不一致的 grant_mode 或 duration_days 参数！', 'danger');
        return;
      }

      const d = state.grantDraft;
      if (!d.reason || !d.reason.trim()) {
        showToast('请填写授权原因 (reason)', 'warn');
        return;
      }

      let startsAt = nowUtcString().slice(0, 16) + ' UTC';
      let endsAt = null;
      let dbMode = 'duration';
      let reqDays = null;

      if (d.mode === 'duration') {
        if (!Number.isInteger(Number(d.duration_days)) || Number(d.duration_days) < 1) {
          showToast('顺延天数必须为正整数', 'warn');
          return;
        }
        const curLatest = computeUserPlanLatestEndsAt(d.user_id, d.product_key, d.plan_key);
        if (curLatest === 'LIFETIME') {
          showToast('该用户在此套餐下已拥有永久授权，无需按天顺延', 'warn');
          return;
        }
        startsAt = curLatest;
        endsAt = addDaysToDateStr(curLatest, Number(d.duration_days));
        dbMode = 'duration';
        reqDays = Number(d.duration_days);
      } else if (d.mode === 'explicit_window') {
        if (!d.starts_at.trim() || !d.ends_at.trim()) {
          showToast('固定时间窗模式下开始时间与结束时间均必填（严禁留空）', 'warn');
          return;
        }
        if (d.ends_at.trim() <= d.starts_at.trim()) {
          showToast('结束时间必须晚于开始时间', 'warn');
          return;
        }
        startsAt = d.starts_at.trim();
        endsAt = d.ends_at.trim();
        dbMode = 'explicit_window';
        reqDays = null;
      } else {
        if (!d.lifetime_confirmed) {
          showToast('请先勾选确认授予永久 Pro 权益', 'warn');
          return;
        }
        startsAt = nowUtcString().slice(0, 16) + ' UTC';
        endsAt = null;
        dbMode = 'explicit_window';
        reqDays = null;
      }

      const newGrantId = 'gr-' + (1000 + state.grants.length + 1);
      state.grants.unshift({
        id: newGrantId,
        user_id: d.user_id,
        product_key: d.product_key,
        plan_key: d.plan_key,
        source_type: 'admin',
        source_ref: `admin:u-owner:${d.request_id}`,
        grant_mode: dbMode,
        requested_duration_days: reqDays,
        starts_at: startsAt,
        ends_at: endsAt,
        revoked_at: null,
        revoke_reason: null,
        reason: d.reason.trim()
      });

      const planObj = getPlanByKey(d.plan_key);
      if (planObj) {
        planObj.is_frozen = true;
        planObj.ref_grants_count = (planObj.ref_grants_count || 0) + 1;
      }

      const targetUser = getUserById(d.user_id);
      appendAuditLog('admin_grant_entitlement', `product:${d.product_key}`, `grant:${newGrantId}`, {
        user: targetUser ? targetUser.email : d.user_id,
        plan_key: d.plan_key,
        grant_mode: dbMode,
        requested_duration_days: reqDays,
        ends_at: endsAt || 'NULL (Lifetime)'
      });

      closeModal();
      renderAll();
      showToast(`已成功授予权益 (${newGrantId})，列表与用户 360° 视图已实时更新`);
    }

    function openRevokeGrantModal(grantId) {
      const g = state.grants.find((x) => x.id === grantId);
      if (!g) return;
      const u = getUserById(g.user_id);

      const body = `
        <div style="background:var(--status-warn-bg); border:1px solid var(--status-warn-bd); padding:11px 14px; border-radius:8px; margin-bottom:14px; font-size:12.5px; color:var(--status-warn-fg);">
          <strong>⚠ 单条授权撤销确认（admin_revoke_grant）</strong>：将撤销用户 <strong>${esc(u ? u.email : g.user_id)}</strong> 在产品 <strong>[${esc(g.product_key)}]</strong> 下的授权 <code>${esc(g.id)}</code>（套餐：<code>${esc(g.plan_key)}</code>）。不会改变用户的产品成员状态。
        </div>
        <div class="form-field" style="margin-bottom:0;">
          <label class="form-label" for="revoke-grant-reason">撤销原因 (必填) *</label>
          <input id="revoke-grant-reason" type="text" class="input" value="订单退款 / 误发授权冲正" style="width:100%;" />
        </div>
      `;
      const footer = `
        <button type="button" class="btn btn-secondary" data-autofocus="true" onclick="closeModal()">取消</button>
        <button type="button" class="btn btn-warning" onclick="confirmRevokeGrant('${esc(g.id)}')">确认撤销授权</button>
      `;
      openModal(`撤销权益授权 (${g.id})`, body, footer);
    }

    function confirmRevokeGrant(grantId) {
      if (checkInjectedFaultBeforeWrite()) return;
      const reason = document.getElementById('revoke-grant-reason')?.value.trim() || '';
      if (!reason) {
        showToast('请填写撤销原因', 'warn');
        return;
      }
      const g = state.grants.find((x) => x.id === grantId);
      if (!g) return;
      g.revoked_at = nowUtcString().slice(0, 16) + ' UTC';
      g.revoke_reason = reason;

      appendAuditLog('admin_revoke_grant', `product:${g.product_key}`, `grant:${g.id}`, {
        user_id: g.user_id,
        plan_key: g.plan_key,
        revoke_reason: reason
      });

      closeModal();
      renderAll();
      showToast(`授权 ${g.id} 已撤销`);
    }
