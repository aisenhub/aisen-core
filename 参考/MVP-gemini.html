                  ? `<button type="button" class="btn btn-sm btn-secondary" onclick="openRestoreMembershipModal('${esc(mem.id)}')">恢复至 ${esc(mem.pre_suspend_status || 'active')}</button>`
                  : mem
                    ? `<button type="button" class="btn btn-sm btn-warning" onclick="openSuspendMembershipModal('${esc(mem.id)}')">暂停成员</button>`
                    : ''
                }
              </div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="surface-card">
          <div class="filter-toolbar">
            <div class="filter-group">
              <input type="text" class="input" placeholder="输入精确邮箱或 UUID 查找用户…" value="${esc(state.usersSearchQuery)}" oninput="state.usersSearchQuery=this.value; renderAll();" style="width:260px;" />
              <button type="button" class="btn btn-sm btn-secondary" onclick="state.usersSearchIncomplete=!state.usersSearchIncomplete; renderAll();">
                ${state.usersSearchIncomplete ? '关闭 search_incomplete 提示' : '模拟 search_incomplete 边界'}
              </button>
            </div>
            <div style="display:flex; gap:8px;">
              <button type="button" class="btn btn-sm ${state.emailRpcDegraded ? 'btn-warning' : 'btn-secondary'}" onclick="toggleEmailDegradationMode()">
                ${state.emailRpcDegraded ? '✓ 已开启邮箱降级 UUID 模式 (点击恢复)' : '模拟邮箱 RPC 失败降级 UUID (DEC-06)'}
              </button>
            </div>
          </div>
          ${incompleteBanner}
          <div class="table-scroll-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>用户 (邮箱 + UUID 内联组合列)</th>
                  <th>邮箱验证</th>
                  <th>全平台账号限制</th>
                  <th>当前产品 (${esc(state.productContext === 'all' ? 'aisenlens' : state.productContext)}) 成员状态</th>
                  <th>首次加入时间 (joined_at)</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="table-footer">
            <span>React-admin ReferenceField 自动合并本页去重 UUID[] 调 1 次 admin_lookup_users，零 N+1 请求</span>
            <span>共 ${filteredUsers.length} 名用户</span>
          </div>
        </div>
      `;
    }

    function toggleEmailDegradationMode() {
      state.emailRpcDegraded = !state.emailRpcDegraded;
      renderAll();
      showToast(state.emailRpcDegraded
        ? '已模拟邮箱查询降级：所有列表安全回退显示缩略 UUID，不阻塞主列表操作'
        : '已恢复 admin_lookup_users 正常批量邮箱展示');
    }

    function buildUser360InspectorHtml() {
      const u = getUserById(state.selectedUserId) || state.users[0];
      const targetProdKey = state.productContext === 'all' ? 'aisenlens' : state.productContext;
      const prod = getProductByKey(targetProdKey);
      const mem = getMembership(u.id, targetProdKey);
      const freePlan = getPlanByKey(prod.current_free_plan_id);

      const userGrants = state.grants.filter((g) => g.user_id === u.id && g.product_key === targetProdKey);
      const activeGrants = userGrants.filter((g) => !g.revoked_at);
      const userReds = state.redemptions.filter((r) => r.user_id === u.id);

      // Compute aggregated capabilities and period facts from existing records
      const mergedFeatures = new Set(freePlan ? freePlan.features : []);
      const mergedLimits = { ...(freePlan ? freePlan.limits : {}) };
      let isLifetime = false;
      let currentPeriodEnd = '无有效 Pro 周期';
      let effectiveEnd = '无有效 Pro 周期';

      activeGrants.forEach((g) => {
        const pl = getPlanByKey(g.plan_key);
        if (pl) {
          (pl.features || []).forEach((f) => mergedFeatures.add(f));
          Object.entries(pl.limits || {}).forEach(([k, v]) => {
            mergedLimits[k] = Math.max(mergedLimits[k] || 0, v);
          });
        }
        if (!g.ends_at) {
          isLifetime = true;
        }
      });

      if (isLifetime) {
        currentPeriodEnd = 'NULL (永久买断)';
        effectiveEnd = 'NULL (永久买断)';
      } else if (activeGrants.length > 0) {
        const sortedEnds = activeGrants.map((g) => g.ends_at).filter(Boolean).sort();
        currentPeriodEnd = sortedEnds[0] || '—';
        effectiveEnd = sortedEnds[sortedEnds.length - 1] || '—';
      }

      // Build 4-step factual chain (Account -> Product -> Membership -> Entitlement Grants)
      let chainBannerHtml = '';
      if (u.blocked) {
        chainBannerHtml = `
          <div style="padding:12px 15px; background:var(--status-danger-bg); border:1px solid var(--status-danger-bd); border-radius:10px; margin-bottom:14px;">
            <div style="font-weight:700; color:var(--status-danger-fg); margin-bottom:4px;">
              🚨 状态事实定位：全平台账号已封禁 (platform_account_restrictions.kind = 'blocked')
            </div>
            <div style="font-size:12.5px; color:var(--status-danger-fg);">
              <strong>条件链核对</strong>：[✓ 1. 邮箱已确认] → <strong>[✗ 2. 全平台限制：已封禁 (${esc(u.block_reason)})]</strong> → 跨所有 SaaS 产品的准入、入会与兑换均被一票否决（历史已记录的授权行不自动物理删除）。
            </div>
          </div>
        `;
      } else if (prod.status !== 'active') {
        chainBannerHtml = `
          <div style="padding:12px 15px; background:var(--status-danger-bg); border:1px solid var(--status-danger-bd); border-radius:10px; margin-bottom:14px;">
            <div style="font-weight:700; color:var(--status-danger-fg); margin-bottom:4px;">
              🚨 状态事实定位：目标产品 [${esc(prod.name)}] 当前处于 ${esc(prod.status)} 停服状态
            </div>
            <div style="font-size:12.5px; color:var(--status-danger-fg);">
              <strong>条件链核对</strong>：[✓ 1. 平台账号正常] → <strong>[✗ 2. 产品状态：${esc(prod.status)}]</strong> → 该产品下所有成员暂时无法使用受保护服务。
            </div>
          </div>
        `;
      } else if (!mem || mem.status !== 'active') {
        const mStatus = mem ? mem.status : 'none';
        chainBannerHtml = `
          <div style="padding:12px 15px; background:var(--status-warn-bg); border:1px solid var(--status-warn-bd); border-radius:10px; margin-bottom:14px;">
            <div style="font-weight:700; color:var(--status-warn-fg); margin-bottom:4px;">
              ⚠ 客诉症结定位：用户拥有 ${activeGrants.length} 条有效 Pro 授权，但当前产品成员状态为「${esc(mStatus.toUpperCase())}」
            </div>
            <div style="font-size:12.5px; color:var(--status-warn-fg);">
              <strong>条件链核对</strong>：[✓ 1. 平台账号正常] → [✓ 2. 产品 ${esc(prod.name)} Active] → <strong>[✗ 3. 产品成员状态：${esc(mStatus)} ${mem && mem.pre_suspend_status ? `(暂停前原状态: ${mem.pre_suspend_status})` : ''}]</strong> → [✓ 4. 有效授权至 ${esc(effectiveEnd)}]。<br/>
              <strong>处置建议</strong>：${mStatus === 'left'
                ? '用户曾主动退出产品（left）。无需补发兑换码，请指引用户在客户端点击「重新加入产品 (rejoin_product)」即可立即恢复使用现有 Pro 权益！'
                : mStatus === 'suspended'
                  ? `该成员已被管理员暂停。若点击下方「解除成员限制」，将精确恢复至暂停前状态 (${esc(mem.pre_suspend_status || 'active')})。`
                  : '该用户尚未加入此产品。'
              }
            </div>
          </div>
        `;
      } else {
        chainBannerHtml = `
          <div style="padding:12px 15px; background:var(--status-active-bg); border:1px solid var(--status-active-bd); border-radius:10px; margin-bottom:14px;">
            <div style="font-weight:700; color:var(--status-active-fg); margin-bottom:4px;">
              ✓ 状态事实定位：账号、产品、成员与有效授权全部正常 (${activeGrants.length > 0 ? 'Pro 权益生效中' : '基础 Free 生效中'})
            </div>
            <div style="font-size:12.5px; color:var(--status-active-fg);">
              <strong>条件链核对</strong>：[✓ 1. 平台账号正常] → [✓ 2. 产品 ${esc(prod.name)} Active] → [✓ 3. 成员状态 Active] → [✓ 4. 合并生效套餐：${esc(freePlan ? freePlan.plan_key : 'free')}${activeGrants.length ? ' + ' + activeGrants.map(g => g.plan_key).join(' + ') : ''}]。
            </div>
          </div>
        `;
      }

      // Quick user switcher bar
      const userTabsHtml = state.users.map((usr) => `
        <button type="button" class="btn btn-sm ${usr.id === u.id ? 'btn-primary' : 'btn-secondary'}" onclick="openUser360For('${esc(usr.id)}')">
          ${esc(usr.email)} ${usr.blocked ? '[Blocked]' : ''}
        </button>
      `).join('');

      const grantRows = userGrants.map((g) => {
        const stInfo = getGrantStatusInfo(g);
        return `
          <tr>
            <td>
              <div style="font-weight:600;">${esc(g.plan_key)}</div>
              <div style="font-size:11px; color:var(--text-secondary); font-family:var(--font-mono);">${esc(g.source_type)} · ${esc(g.grant_mode)}</div>
            </td>
            <td style="font-family:var(--font-mono); font-size:12px;">${esc(g.starts_at)} → <strong>${esc(g.ends_at || 'NULL (永久)')}</strong></td>
            <td>${stInfo.badge}</td>
            <td>
              ${!g.revoked_at
                ? `<button type="button" class="btn btn-sm btn-warning" onclick="openRevokeGrantModal('${esc(g.id)}')">撤销</button>`
                : `<span style="font-size:11.5px; color:var(--text-muted);">已撤销</span>`
              }
            </td>
          </tr>
        `;
      }).join('');

      const redRows = userReds.map((r) => `
        <tr>
          <td><span class="uuid-chip" onclick="copyText('${esc(r.id)}')">${esc(r.id)} ⧉</span></td>
          <td><span class="key-tag">${esc(r.product_key)}</span> <code>${esc(r.plan_key)}</code></td>
          <td><span class="uuid-chip" onclick="copyText('${esc(r.code_id)}')">${esc(r.code_id)} ⧉</span></td>
          <td style="font-family:var(--font-mono); font-size:11.5px; color:var(--text-secondary);">${esc(r.created_at)}</td>
        </tr>
      `).join('');

      return `
        <!-- Quick User Selector Bar -->
        <div class="surface-card" style="margin-bottom:14px;">
          <div class="surface-card-body" style="padding:11px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
            <span style="font-size:12.5px; font-weight:600; color:var(--text-secondary);">快速切换诊断目标用户：</span>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">${userTabsHtml}</div>
          </div>
        </div>

        <!-- Top Identity & Global Restriction Header -->
        <div class="surface-card">
          <div class="surface-card-body" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;">
            <div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
                <span style="font-size:18px; font-weight:700;">${esc(u.email)}</span>
                <span class="uuid-chip" onclick="copyText('${esc(u.uuid)}', '已复制用户完整 UUID')">${esc(u.uuid)} ⧉</span>
                <span class="status-badge status-info">${u.email_confirmed ? '✓ 邮箱已确认' : '待邮箱确认'}</span>
                ${u.blocked
                  ? `<span class="status-badge status-danger">✕ 全平台已封禁 (原因: ${esc(u.block_reason)})</span>`
                  : `<span class="status-badge status-active">✓ 平台账号状态正常</span>`
                }
              </div>
              <div style="font-size:12px; color:var(--text-secondary); font-family:var(--font-mono);">
                注册时间: ${esc(u.created_at)} · 最近登录: ${esc(u.last_sign_in_at)}
              </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn btn-primary" onclick="openGrantEntitlementModal('${esc(u.id)}')">+ 为此用户直授权益</button>
              ${u.blocked
                ? `<button type="button" class="btn btn-danger-solid" onclick="openUnblockAccountModal('${esc(u.id)}')">解除全平台封禁</button>`
                : `<button type="button" class="btn btn-danger" onclick="openBlockAccountModal('${esc(u.id)}')">[全局高危] 平台账号封禁</button>`
              }
            </div>
          </div>
        </div>

        <!-- Section 1: Trusted Access Conditions & Entitlement Facts Summary Card -->
        <div class="surface-card">
          <div class="surface-card-header">
            <h2 class="section-title">
              <span>第一区：可信准入条件与有效权益事实摘要 (${esc(prod.name)})</span>
            </h2>
            <span style="font-size:11.5px; color:var(--text-secondary);">基于安全表与授权记录汇总 · 不模拟跨用户代查 check_access</span>
          </div>
          <div class="surface-card-body">
            ${chainBannerHtml}
            <div class="grid-4col">
              <div style="padding:10px 12px; background:var(--bg-subtle); border:1px solid var(--border-default); border-radius:8px;">
                <div style="font-size:11.5px; color:var(--text-secondary);">本期截止 (current_period_ends_at)</div>
                <div style="font-family:var(--font-mono); font-weight:700; font-size:13px; margin-top:3px;">${esc(currentPeriodEnd)}</div>
              </div>
              <div style="padding:10px 12px; background:var(--primary-soft); border:1px solid var(--primary-border); border-radius:8px;">
                <div style="font-size:11.5px; color:var(--primary-main); font-weight:600;">连续续期总截止 (effective_ends_at)</div>
                <div style="font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--primary-main); margin-top:3px;">${esc(effectiveEnd)}</div>
              </div>
              <div style="padding:10px 12px; background:var(--bg-subtle); border:1px solid var(--border-default); border-radius:8px;">
                <div style="font-size:11.5px; color:var(--text-secondary);">永久买断标识 (is_lifetime)</div>
                <div style="font-family:var(--font-mono); font-weight:700; font-size:13px; margin-top:3px;">${isLifetime ? 'true (永久无自然截止日)' : 'false (周期顺延态)'}</div>
              </div>
              <div style="padding:10px 12px; background:var(--bg-subtle); border:1px solid var(--border-default); border-radius:8px;">
                <div style="font-size:11.5px; color:var(--text-secondary);">合并最高配额 (limits 取最大值)</div>
                <div style="font-family:var(--font-mono); font-weight:700; font-size:12px; margin-top:3px;">${esc(JSON.stringify(mergedLimits))}</div>
              </div>
            </div>
            <div style="margin-top:12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">合并功能开关 (features 并集)：</span>
              ${Array.from(mergedFeatures).map((f) => `<span class="key-tag">${esc(f)}</span>`).join('')}
            </div>
          </div>
        </div>

        <!-- Section 2 & 3: Product Memberships + Entitlement Grants -->
        <div class="grid-2col" style="margin-bottom:16px;">
          <div class="surface-card" style="margin-bottom:0;">
            <div class="surface-card-header">
              <h2 class="section-title">第二区：产品成员关系与事件时间线</h2>
              <span class="status-badge status-warn">单产品级作用域</span>
            </div>
            <div class="table-scroll-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>产品</th>
                    <th>成员状态 (含 pre_suspend_status)</th>
                    <th>单产品操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${mem ? `
                    <tr>
                      <td><span class="key-tag">${esc(mem.product_key)}</span></td>
                      <td>
                        ${mem.status === 'active'
                          ? `<span class="status-badge status-active">✓ Active</span>`
                          : mem.status === 'left'
                            ? `<span class="status-badge status-warn">● Left (已主动退出)</span>`
                            : `<span class="status-badge status-danger">✕ Suspended (暂停前: ${esc(mem.pre_suspend_status || 'active')})</span>`
                        }
                      </td>
                      <td>
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                          ${mem.status === 'suspended'
                            ? `<button type="button" class="btn btn-sm btn-primary" onclick="openRestoreMembershipModal('${esc(mem.id)}')">恢复至 ${esc(mem.pre_suspend_status || 'active')}</button>`
                            : `<button type="button" class="btn btn-sm btn-warning" onclick="openSuspendMembershipModal('${esc(mem.id)}')">暂停成员</button>`
                          }
                          <button type="button" class="btn btn-sm btn-secondary" onclick="openMembershipEventsDrawer('${esc(mem.id)}')">事件抽屉 (${mem.events.length})</button>
                        </div>
                      </td>
                    </tr>
                  ` : `
                    <tr>
                      <td colspan="3" style="text-align:center; padding:24px; color:var(--text-secondary);">该用户尚未加入产品 ${esc(targetProdKey)}</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
            ${mem ? `
              <div style="padding:11px 16px; border-top:1px solid var(--border-default); background:var(--bg-toolbar); font-size:12px; color:var(--text-secondary); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                <span>最近事件：<code>${esc(mem.events[0]?.at)}</code> · <strong>${esc(mem.events[0]?.from)} → ${esc(mem.events[0]?.to)}</strong></span>
                <button type="button" class="btn btn-sm btn-secondary" onclick="openMembershipEventsDrawer('${esc(mem.id)}')">滑出完整事件时间线 →</button>
              </div>
            ` : ''}
          </div>

          <div class="surface-card" style="margin-bottom:0;">
            <div class="surface-card-header">
              <h2 class="section-title">第三区：用户授权记录 (${userGrants.length})</h2>
              <button type="button" class="btn btn-sm btn-primary" onclick="openGrantEntitlementModal('${esc(u.id)}')">+ 直授权益</button>
            </div>
            <div class="table-scroll-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>套餐 / 模式</th>
                    <th>生效区间 (UTC)</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${grantRows || `<tr><td colspan="4" style="text-align:center; padding:24px; color:var(--text-secondary);">暂无授权记录</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Section 4: Redemptions History -->
        <div class="surface-card" style="margin-bottom:0;">
          <div class="surface-card-header">
            <h2 class="section-title">第四区：该用户的兑换码核销记录 (${userReds.length})</h2>
            <span style="font-size:12px; color:var(--text-secondary);">只读历史事实</span>
          </div>
          <div class="table-scroll-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>核销 ID</th>
                  <th>产品 / 套餐</th>
                  <th>消耗单码 ID</th>
                  <th>核销时间 (UTC)</th>
                </tr>
              </thead>
              <tbody>
                ${redRows || `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--text-secondary);">该用户暂无兑换码核销记录</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openSuspendMembershipModal(memId) {
      const m = state.memberships.find((x) => x.id === memId);
      if (!m) return;
      const u = getUserById(m.user_id);

      const body = `
        <div style="background:var(--status-warn-bg); border:1px solid var(--status-warn-bd); padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:12.5px; color:var(--status-warn-fg);">
          <strong>⚠ 单产品级影响范围（L2 琥珀色警告 · admin_suspend_membership）</strong>：<br/>
          1. 仅暂停用户 <strong>${esc(u ? u.email : m.user_id)}</strong> 在当前产品 <strong>[${esc(m.product_key)}]</strong> 的成员资格，<strong>不影响其在其他 SaaS 产品的正常使用</strong>；<br/>
          2. 系统将自动保存暂停前状态 <code>pre_suspend_status = '${esc(m.status)}'</code>；未来解除限制时将精确恢复为 <code>${esc(m.status)}</code>（若原本为 <code>left</code>，解除后仍保持 <code>left</code>，绝不错误激活为 <code>active</code>）。
        </div>
        <div class="form-field" style="margin-bottom:0;">
          <label class="form-label" for="suspend-mem-reason">暂停原因码 (写入 membership_events 与审计，必填) *</label>
          <input id="suspend-mem-reason" type="text" class="input" value="tos_violation_single_product" style="width:100%;" />
        </div>
      `;
      const footer = `
        <button type="button" class="btn btn-secondary" data-autofocus="true" onclick="closeModal()">取消</button>
        <button type="button" class="btn btn-warning" onclick="confirmSuspendMembership('${esc(m.id)}')">确认暂停单产品成员</button>
      `;
      openModal(`暂停产品成员资格 (${m.product_key})`, body, footer);
    }

    function confirmSuspendMembership(memId) {
      if (checkInjectedFaultBeforeWrite()) return;
      const reason = document.getElementById('suspend-mem-reason')?.value.trim() || '';
      if (!reason) {
        showToast('请填写暂停原因', 'warn');
        return;
      }
      const m = state.memberships.find((x) => x.id === memId);
      if (!m) return;
      const prevStatus = m.status;
      m.pre_suspend_status = prevStatus;
      m.status = 'suspended';
      m.events.unshift({

    function confirmCreateProduct() {
      if (checkInjectedFaultBeforeWrite()) return;
      const pKey = document.getElementById('new-prod-key')?.value.trim().toLowerCase() || '';
      const pName = document.getElementById('new-prod-name')?.value.trim() || '';
      const pDesc = document.getElementById('new-prod-desc')?.value.trim() || '';
      if (!/^[a-z][a-z0-9_-]{2,32}$/.test(pKey) || !pName) {
        showToast('请输入合法的 product_key 与产品名称', 'warn');
        return;
      }
      if (state.products.some((p) => p.product_key === pKey)) {
        showToast(`409 STATE_CONFLICT：product_key '${pKey}' 已存在`, 'danger');
        return;
      }

      const defaultFreeId = `${pKey}_free_v1`;
      state.plans.push({
        id: defaultFreeId,
        product_key: pKey,
        plan_family: 'free',
        plan_key: 'free',
        name: `${pName} Free 基础版 (v1)`,
        features: [`${pKey}.basic`],
        limits: { 'workspace.max_projects': 3 },
        default_duration_days: null,
        is_active: true,
        is_frozen: true,
        ref_codes_count: 0,
        ref_grants_count: 0
      });

      state.products.push({
        id: 'prod-0' + (state.products.length + 1),
        product_key: pKey,
        name: pName,
        status: 'active',
        current_free_plan_id: defaultFreeId,
        description: pDesc,
        updated_at: nowUtcString()
      });

      appendAuditLog('admin_upsert_product', 'global', `product:${pKey}`, {
        name: pName,
        status: 'active',
        current_free_plan_id: defaultFreeId
      });

      closeModal();
      renderAll();
      showToast(`已注册新产品 ${pName} (${pKey})，顶部产品空间切换器已同步更新`);
    }

    function executeSimulatedClientRedeem() {
      const userId = document.getElementById('sim-redeem-user')?.value || 'u-wang';
      const prodKey = document.getElementById('sim-redeem-prod')?.value || 'aisenlens';
      const token = document.getElementById('sim-redeem-token')?.value.trim() || '';
      const resBox = document.getElementById('sim-redeem-result-box');
      if (!resBox) return;

      const u = getUserById(userId);
      const prod = getProductByKey(prodKey);
      const mem = getMembership(userId, prodKey);

      // Step 1: Global blocked check
      if (u && u.blocked) {
        resBox.innerHTML = `<div style="padding:10px 12px; background:var(--status-danger-bg); border:1px solid var(--status-danger-bd); border-radius:8px; font-size:12.5px; color:var(--status-danger-fg);"><strong>返回结果：</strong><code>{ "ok": false, "code": "ACCOUNT_RESTRICTED" }</code> — 账号已被全平台封禁，查码前直接拦截。</div>`;
        return;
      }
      // Step 2: Product active check
      if (!prod || prod.status !== 'active') {
        resBox.innerHTML = `<div style="padding:10px 12px; background:var(--status-danger-bg); border:1px solid var(--status-danger-bd); border-radius:8px; font-size:12.5px; color:var(--status-danger-fg);"><strong>返回结果：</strong><code>{ "ok": false, "code": "PRODUCT_UNAVAILABLE" }</code> — 产品未处于 active 状态。</div>`;
        return;
      }
      // Step 3: DEC-01 Pre-code membership check (left / suspended rejected before touching redemption_codes table)
      if (mem && (mem.status === 'left' || mem.status === 'suspended')) {
        const errCode = mem.status === 'left' ? 'MEMBERSHIP_LEFT' : 'MEMBERSHIP_SUSPENDED';
        resBox.innerHTML = `<div style="padding:10px 12px; background:var(--status-warn-bg); border:1px solid var(--status-warn-bd); border-radius:8px; font-size:12.5px; color:var(--status-warn-fg);"><strong>DEC-01 防侧信道拦截：</strong><code>{ "ok": false, "code": "${errCode}" }</code> — 在查询 <code>redemption_codes</code> 表之前直接拒绝！既不泄露该兑换码是否存在，也不误扣正常退出用户的 10 次防枚举限流配额（提示：请切换为 <code>creator_lin@aisen.com</code> 测试成功核销）。</div>`;
        return;
      }

      // Step 4: Lookup code & check product ownership
      const codeObj = state.codes.find((c) => c.demo_token && c.demo_token === token);
      if (!codeObj || codeObj.product_key !== prodKey || codeObj.status !== 'available' || codeObj.redeemed_count >= codeObj.max_redemptions) {
        resBox.innerHTML = `<div style="padding:10px 12px; background:var(--status-danger-bg); border:1px solid var(--status-danger-bd); border-radius:8px; font-size:12.5px; color:var(--status-danger-fg);"><strong>返回结果：</strong><code>{ "ok": false, "code": "REDEEM_CODE_INVALID" }</code> — 码不存在、跨产品不匹配、已撤销或已用尽统一返回该错误码，并计入 <code>redemption_rate_limits</code>。</div>`;
        return;
      }

      // Step 5: Atomic Redemption Success
      codeObj.redeemed_count += 1;
      if (codeObj.redeemed_count >= codeObj.max_redemptions) {
        codeObj.status = 'exhausted';
        codeObj.demo_token = null;
      }

      if (!mem) {
        state.memberships.push({
          id: 'mem-0' + (state.memberships.length + 1),
          user_id: userId,
          product_key: prodKey,
          status: 'active',
          pre_suspend_status: null,
          joined_at: nowUtcString(),
          events: [{ at: nowUtcString(), action: 'join', from: 'none', to: 'active', actor: 'user (首次兑换自动入会)', reason: 'redeem_code_auto_join' }]
        });
      }

      const batchObj = state.batches.find((b) => b.id === codeObj.batch_id);
      const durationDays = batchObj ? batchObj.grant_duration_days : 365;
      const curLatest = computeUserPlanLatestEndsAt(userId, prodKey, codeObj.plan_key);
      const startStr = curLatest === 'LIFETIME' ? nowUtcString() : curLatest;
      const endStr = curLatest === 'LIFETIME' ? null : addDaysToDateStr(startStr, durationDays);

      const newGrantId = 'gr-' + (1000 + state.grants.length + 1);
      state.grants.unshift({
        id: newGrantId,
        user_id: userId,
        product_key: prodKey,
        plan_key: codeObj.plan_key,
        source_type: 'redeem_code',
        source_ref: codeObj.id,
        grant_mode: 'duration',
        requested_duration_days: durationDays,
        starts_at: startStr,
        ends_at: endStr,
        revoked_at: null,
        revoke_reason: null,
        reason: `用户核销兑换码 ${codeObj.id}`
      });

      const newRedId = 'red-' + (9000 + state.redemptions.length + 1);
      state.redemptions.unshift({
        id: newRedId,
        user_id: userId,
        product_key: prodKey,
        plan_key: codeObj.plan_key,
        code_id: codeObj.id,
        batch_id: codeObj.batch_id,
        grant_id: newGrantId,
        created_at: nowUtcString()
      });

      renderAll();
      resBox.innerHTML = `<div style="padding:10px 12px; background:var(--status-active-bg); border:1px solid var(--status-active-bd); border-radius:8px; font-size:12.5px; color:var(--status-active-fg);"><strong>✓ 原子核销成功：</strong><code>{ "ok": true, "grant_id": "${newGrantId}", "redemption_id": "${newRedId}" }</code> — 单码状态已更新为已核销，新授权与核销流水已实时同步至后台列表！</div>`;
      showToast(`模拟客户端核销成功！生成授权 ${newGrantId}`);
    }

      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-footer').innerHTML = footerHtml || '';
      const closeX = document.getElementById('modal-close-x');
      if (closeX) closeX.style.display = lockBackdrop ? 'none' : 'inline-flex';
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('open');

      setTimeout(() => {
        const autoBtn = backdrop.querySelector('[data-autofocus="true"]') || backdrop.querySelector('input:not([readonly]), select, button');
        if (autoBtn) autoBtn.focus();
      }, 20);
    }

    function closeModal() {
      window._modalLocked = false;
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    function openDrawer(eyebrow, title, bodyHtml) {
      document.getElementById('drawer-eyebrow').textContent = eyebrow;
      document.getElementById('drawer-title').textContent = title;
      document.getElementById('drawer-body').innerHTML = bodyHtml;
      document.getElementById('drawer-backdrop').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer-backdrop').classList.remove('open');
    }

    function handleDrawerBackdropClick(ev) {
      if (ev.target && ev.target.id === 'drawer-backdrop') {
        closeDrawer();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('drawer-backdrop').classList.contains('open')) {
          closeDrawer();
        } else if (document.getElementById('modal-backdrop').classList.contains('open') && !window._modalLocked) {
          closeModal();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });
  </script>
</body>
</html>
